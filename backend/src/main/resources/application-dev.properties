# Profilo "dev": si attiva a mano in sviluppo locale
# (SPRING_PROFILES_ACTIVE=dev, oppure --spring.profiles.active=dev).
#
# Completa application.properties, non lo sostituisce: qui stanno solo le cose che
# hanno senso su una macchina di sviluppo e che NON devono valere altrove.

# Il frontend React gira su una porta diversa dal backend, quindi ogni sua chiamata
# e' cross-origin e senza questa riga il browser la blocca. Il pattern con il jolly
# sulla porta esiste perche' in dev la porta cambia da sola (Vite ne prende una libera).
# Sta qui e non in application.properties di proposito: un permesso pensato per
# localhost non deve essere il default che parte anche in produzione (vedi CorsProperties).
felix.security.cors.allowed-origins=http://localhost:*
