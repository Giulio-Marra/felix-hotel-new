  /api/staff/{id}/attivazione:

    put:
      tags:
        - Staff
      operationId: impostaAttivazioneStaff
      summary: Attiva o disattiva un account del personale
      description: >
        Accende o spegne l'accesso di un account, senza cancellarlo. Riservato
        agli **ADMIN**.
        **Non esiste un DELETE, ed e' questo il suo posto**: il personale
        compare nelle prenotazioni che ha gestito, e cancellare la riga
        porterebbe via l'unica risposta alla domanda "chi ha registrato questa
        prenotazione". Chi non lavora piu' qui si disattiva.
        Un account disattivato **non puo' piu' autenticarsi** — il controllo e'
        quello che gia' esiste su ogni richiesta — mentre le prenotazioni che ha
        gestito **restano intestate a lui**: sono storia, e la storia dice chi
        c'era davvero.
        Disattivare l'ultimo ADMIN attivo e' un **409**, per la stessa ragione
        per cui non lo si puo' degradare: e' l'unica operazione da cui non si
        torna indietro senza aprire il database.
        **Un ADMIN puo' disattivare se stesso**, purche' non sia l'ultimo: da
        quel momento non passa piu' nemmeno la sua richiesta successiva, perche'
        l'attivazione viene riletta dal database ad ogni chiamata e il token gia'
        emesso non basta piu'. A riaprirgli la porta e' un collega, ed e'
        esattamente il motivo per cui il 409 sull'ultimo esiste.
        Rimandare lo stato che l'account ha gia' risponde 200: l'operazione e'
        idempotente.
        Risposta: busta ApiBaseResponse con **StaffResponse** in 'data'.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdStaff'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAttivazioneRequest'
      responses:
        '200':
          description: Attivazione aggiornata ('data' = StaffResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Attivazione dell'account aggiornata
                timestamp: 2026-08-27T10:15:30Z
                data:
                  id: 1
                  nome: Anna
                  cognome: Bianchi
                  email: anna.bianchi@felixhotel.it
                  telefono: "+39 333 1234567"
                  dataAssunzione: "2024-03-01"
                  ruolo: STAFF
                  attivo: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/staff/{id}/password:

    put:
      tags:
        - Staff
      operationId: impostaPasswordStaff
      summary: Imposta la password di un account del personale
      description: >
        Sostituisce la password di un account con una nuova, scelta da chi
        chiama. Riservato agli **ADMIN**.
        E' il rovescio necessario della scelta fatta in creazione: se la
        password la assegna l'amministratore, dev'essere lui a poterla
        riassegnare — altrimenti la prima dimenticata torna a essere una UPDATE
        a mano sul database. **Non e' un "cambio password" dell'interessato**:
        non chiede quella vecchia, perche' chi la usa e' qualcun altro che sta
        rimediando, non il titolare che si ricorda la sua.
        La nuova password viene salvata come hash BCrypt.
        Risposta: busta ApiBaseResponse con 'data' null — la password non torna
        indietro in nessuna forma, nemmeno per conferma.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdStaff'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPasswordRequest'
      responses:
        '200':
          description: Password aggiornata ('data' = null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Password aggiornata
                timestamp: 2026-08-27T10:15:30Z
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/impostazioni:

    get:
      tags:
        - Impostazioni
      operationId: dettaglioImpostazioni
      summary: Impostazioni complete della struttura
      description: >
        Restituisce **tutti** i dati della struttura, compresi quelli fiscali e
        i codici degli adempimenti (CIN, comune ISTAT, codice per Alloggiati
        Web). Riservato agli **ADMIN**: e' la vista da cui si riempie il modulo
        di modifica, e la PUT sostituisce l'intera risorsa — chi non puo'
        leggerla tutta non puo' riscriverla senza cancellare cio' che non vede.
        Il pubblico legge invece /api/impostazioni/pubbliche, che porta i soli
        recapiti e gli orari.
        Risposta: busta ApiBaseResponse con **ImpostazioniHotelResponse** in
        'data'.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Impostazioni della struttura ('data' = ImpostazioniHotelResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Impostazioni recuperate
                timestamp: 2026-08-28T10:15:30Z
                data:
                  nome: Felix Hotel
                  indirizzo: Via Roma 1, 47921 Rimini (RN)
                  telefono: "+39 0541 123456"
                  email: info@felixhotel.it
                  orarioCheckInDefault: "14:00:00"
                  orarioCheckOutDefault: "10:00:00"
                  ragioneSociale: Felix Hotel S.r.l.
                  partitaIva: "01234567890"
                  codiceFiscale: "01234567890"
                  cin: IT099014B4XYZW1234
                  comune: Rimini
                  codiceIstatComune: "099014"
                  codiceStrutturaAlloggiati: "RN012345"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Impostazioni
      operationId: aggiornaImpostazioni
      summary: Aggiorna le impostazioni della struttura
      description: >
        Sostituisce **tutti** i campi delle impostazioni: e' una PUT, non una
        PATCH, quindi un campo omesso viene azzerato e non lasciato com'era.
        Riservato agli **ADMIN**.
        **Non esiste una POST**: la struttura e' una sola e la sua riga nasce
        con la migration V8, gia' compilata con dei segnaposto. Non c'e' quindi
        nessuno stato "impostazioni non ancora create" da gestire — la GET
        risponde sempre 200.
        Risposta: busta ApiBaseResponse con **ImpostazioniHotelResponse** in
        'data'.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpostazioniHotelRequest'
      responses:
        '200':
          description: Impostazioni aggiornate ('data' = ImpostazioniHotelResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Impostazioni aggiornate
                timestamp: 2026-08-28T10:15:30Z
                data:
                  nome: Felix Hotel
                  indirizzo: Via Roma 1, 47921 Rimini (RN)
                  telefono: "+39 0541 123456"
                  email: info@felixhotel.it
                  orarioCheckInDefault: "15:00:00"
                  orarioCheckOutDefault: "10:00:00"
                  ragioneSociale: Felix Hotel S.r.l.
                  partitaIva: "01234567890"
                  codiceFiscale: "01234567890"
                  cin: IT099014B4XYZW1234
                  comune: Rimini
                  codiceIstatComune: "099014"
                  codiceStrutturaAlloggiati: "RN012345"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/impostazioni/pubbliche:

    get:
      tags:
        - Impostazioni
      operationId: dettaglioImpostazioniPubbliche
      summary: Recapiti e orari della struttura
      description: >
        Restituisce i dati che una struttura pubblica di sua volonta': nome,
        indirizzo, recapiti e orari di check-in e check-out. **Pubblico**, come
        il catalogo e la ricerca di disponibilita': sono le informazioni che
        stanno in fondo a ogni pagina di un sito d'albergo, e chiederle solo a
        chi si e' registrato non proteggerebbe niente.
        **Non porta i dati fiscali ne' i codici degli adempimenti** — partita
        IVA, CIN, codice ISTAT del comune e codice per Alloggiati Web stanno
        solo in /api/impostazioni, che vuole un ADMIN. E' il motivo per cui gli
        schemi di risposta sono due e non uno: quello pubblico non li ha
        proprio, quindi non c'e' nessun filtro che qualcuno possa dimenticare.
        Risposta: busta ApiBaseResponse con
        **ImpostazioniHotelPubblicheResponse** in 'data'.
      responses:
        '200':
          description: Recapiti della struttura ('data' = ImpostazioniHotelPubblicheResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Impostazioni recuperate
                timestamp: 2026-08-28T10:15:30Z
                data:
                  nome: Felix Hotel
                  indirizzo: Via Roma 1, 47921 Rimini (RN)
                  telefono: "+39 0541 123456"
                  email: info@felixhotel.it
                  orarioCheckInDefault: "14:00:00"
                  orarioCheckOutDefault: "10:00:00"
        '500':
          $ref: '#/components/responses/InternalServerError'
components:

  # Parametri riusabili, stessa logica dei responses qui sotto: si dichiarano
  # una volta e si referenziano, invece di ripetere descrizione e vincoli su
  # ogni rotta che li usa.
  parameters:

    IdTipologiaCamera:
      name: id
      in: path
      required: true
      description: Identificativo della tipologia di camera
      schema:
        type: integer
        format: int64
        minimum: 1

    IdDotazione:
      name: id
      in: path
      required: true
      description: Identificativo della dotazione
      schema:
        type: integer
        format: int64
        minimum: 1

    IdCamera:
      name: id
      in: path
      required: true
      description: Identificativo della camera
      schema:
        type: integer
        format: int64
        minimum: 1

    IdMediaCamera:
      name: mediaId
      in: path
      required: true
      description: >
        Identificativo della foto. Si accompagna sempre all'id della tipologia
        nel percorso: una foto non ha una rotta propria, esiste dentro la
        galleria a cui appartiene.
      schema:
        type: integer
        format: int64
        minimum: 1

    IdPeriodoTariffario:
      name: tariffaId
      in: path
      required: true
      description: >
        Identificativo del periodo tariffario. Si accompagna sempre all'id della
        tipologia nel percorso: un periodo non ha una rotta propria, esiste
        dentro il calendario dei prezzi della tipologia a cui appartiene.
      schema:
        type: integer
        format: int64
        minimum: 1

    IdPrenotazione:
      name: id
      in: path
      required: true
      description: Identificativo della prenotazione
      schema:
        type: integer
        format: int64
        minimum: 1

    IdOspite:
      name: ospiteId
      in: path
      required: true
      description: >
        Identificativo dell'ospite. Si accompagna sempre all'id della
        prenotazione nel percorso: un ospite non ha una rotta propria, esiste
        dentro il soggiorno per cui e' stato registrato.
      schema:
        type: integer
        format: int64
        minimum: 1

    FiltroStatoPrenotazione:
      name: stato
      in: query
      required: false
      description: >
        Se valorizzato, restituisce le sole prenotazioni in quello stato — per
        esempio le CONFERMATA da preparare, o le IN_ATTESA mai portate a
        termine. Uno stato fuori dall'elenco e' un 400: e' un valore che non
        esiste, non un filtro che non trova niente.
      schema:
        $ref: '#/components/schemas/StatoPrenotazione'

    DataCheckInRicerca:
      name: dataCheckIn
      in: query
      required: true
      description: >
        Giorno di arrivo del soggiorno cercato. **Obbligatorio**: senza un
        periodo non c'e' nessuna disponibilita' da calcolare, e la domanda
        diventa quella del catalogo — che ha gia' il suo endpoint.
        A differenza della creazione, qui un arrivo nel passato **non e' un
        errore**: si sta guardando, non prenotando, e una ricerca sbagliata si
        corregge da sola cambiando le date. Il risultato pero' e' quello che e' —
        cio' che risulta libero ieri non e' un'offerta.
      schema:
        type: string
        format: date
      example: 2026-09-10

    DataCheckOutRicerca:
      name: dataCheckOut
      in: query
      required: true
      description: >
        Giorno di partenza, che deve essere **successivo** all'arrivo: un
        soggiorno di zero notti non esiste, e il vincolo non e' esprimibile
        nello schema perche' lega due campi fra loro. Lo verifica il service,
        che risponde 400.
        Come nella prenotazione, **il giorno di partenza non e' occupato**: chi
        parte il 13 libera la camera per chi arriva il 13.
      schema:
        type: string
        format: date
      example: 2026-09-13

    FiltroNumeroOspiti:
      name: numeroOspiti
      in: query
      required: false
      description: >
        Se valorizzato, restituisce le sole tipologie che ospitano almeno
        quelle persone. E' il **filtro per capienza** rimandato il 2026-08-06
        proprio in attesa di questo endpoint: farlo prima sul catalogo voleva
        dire scriverlo due volte, perche' qui capienza e date si chiedono
        insieme.
        Facoltativo perche' "cosa c'e' libero" e' una domanda legittima quanto
        "cosa c'e' libero per tre".
      schema:
        type: integer
        minimum: 1
        maximum: 50
      example: 2

    FiltroPrezzoMinimo:
      name: prezzoMinimo
      in: query
      required: false
      description: >
        Se valorizzato, esclude le tipologie che costano **meno** di tanto per
        notte. Il confronto e' sul prezzo di una notte e non sul totale del
        soggiorno: e' il numero con cui si ragiona scegliendo una camera.
        **E' il prezzo medio delle notti cercate, non il listino della
        tipologia**, e dal 2026-09-01 questa e' la differenza che conta: con le
        tariffe per periodo la stessa camera costa cose diverse a Ferragosto e in
        novembre, quindi filtrare sul listino vorrebbe dire offrire a chi cerca
        sotto i cento euro una stanza che in quelle date ne costa duecento.
        Medio, perche' dentro un soggiorno le notti possono costare diversamente
        l'una dall'altra — periodi diversi, o giorni della settimana diversi.
      schema:
        type: number
        minimum: 0
        maximum: 99999999.99
      example: 80.00

    FiltroPrezzoMassimo:
      name: prezzoMassimo
      in: query
      required: false
      description: >
        Se valorizzato, esclude le tipologie che costano **piu'** di tanto per
        notte. Come il minimo, guarda il **prezzo medio delle notti cercate** e
        non il listino della tipologia.
        Si combina col minimo; un massimo inferiore al minimo non e' un
        errore, e' una pagina vuota — come per gli altri filtri, una domanda ben
        posta a cui la risposta e' "niente".
      schema:
        type: number
        minimum: 0
        maximum: 99999999.99
      example: 200.00

    FiltroTipologiaCamera:
      name: tipologiaCameraId
      in: query
      required: false
      description: >
        Se valorizzato, restituisce le sole camere di quella tipologia. Un id
        che non corrisponde a nessuna tipologia non e' un errore: e' una pagina
        vuota, perche' "non ne ho di quel tipo" e' una risposta legittima a una
        domanda ben posta.
      schema:
        type: integer
        format: int64
        minimum: 1

    FiltroStatoCamera:
      name: stato
      in: query
      required: false
      description: >
        Se valorizzato, restituisce le sole camere in quello stato operativo.
        Uno stato fuori dall'elenco e' invece un 400: e' un valore che non
        esiste, non un filtro che non trova niente.
      schema:
        $ref: '#/components/schemas/StatoCamera'

    IdStaff:
      name: id
      in: path
      required: true
      description: Identificativo dell'account del personale
      schema:
        type: integer
        format: int64
        minimum: 1

    FiltroRuoloStaff:
      name: ruolo
      in: query
      required: false
      description: >
        Se valorizzato, restituisce i soli account con quel ruolo. Un ruolo
        fuori dall'elenco e' un 400 e non una pagina vuota: e' un valore che non
        esiste, non un filtro che non trova niente.
      schema:
        $ref: '#/components/schemas/RuoloStaff'

    FiltroAttivo:
      name: attivo
      in: query
      required: false
      description: >
        Se valorizzato, restituisce i soli account attivi (true) o i soli
        disattivati (false). Assente vuol dire **tutti**, ed e' il default
        voluto: chi apre l'elenco del personale deve vedere anche chi non
        lavora piu' qui, altrimenti non puo' riattivarlo.
      schema:
        type: boolean
    PaginaNumero:
      name: page
      in: query
      required: false
      description: Numero della pagina richiesta, 0-based
      schema:
        type: integer
        minimum: 0
        default: 0

    PaginaDimensione:
      name: size
      in: query
      required: false
      description: >
        Quanti elementi contiene una pagina. Il massimo non e' arbitrario
        ne' negoziabile: senza un tetto, una sola richiesta con un size
        enorme si farebbe restituire l'intera tabella in un colpo.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # Risposte d'errore riusabili: tutte usano la stessa busta ApiBaseResponse
  # degli endpoint di successo (con 'data' null, tranne la validazione — vedi
  # BadRequest). Si dichiarano qui una volta sola e si referenziano con $ref
  # dai singoli endpoint, invece di riscriverle ad ogni rotta.
  responses:

    BadRequest:
      description: >
        Richiesta non valida: violazione dei vincoli dichiarati sullo schema
        del body (@Valid), JSON malformato, tipo di parametro sbagliato, o
        una regola applicativa sull'input (es. consenso privacy non
        accettato). E' l'unico errore con 'data' valorizzato: quando
        l'errore viene dalla validazione dei campi, 'data' contiene una
        mappa nome-campo -> messaggio, cosi' il client puo' segnalare il
        singolo input sbagliato senza interpretare il messaggio testuale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 400
            message: Dati non validi
            timestamp: 2026-08-05T10:15:30Z
            data:
              password: deve contenere almeno 8 caratteri
              email: deve essere un indirizzo email valido

    Unauthorized:
      description: >
        Autenticazione assente o non valida: token mancante, malformato,
        scaduto, account disattivato, oppure credenziali errate sul login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 401
            message: Autenticazione richiesta
            timestamp: 2026-08-05T10:15:30Z
            data: null

    Forbidden:
      description: >
        Account autenticato ma senza i permessi necessari (ruolo
        insufficiente). Diverso dal 401: qui l'identita' e' nota, non basta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 403
            message: Permessi insufficienti per questa operazione
            timestamp: 2026-08-05T10:15:30Z
            data: null

    NotFound:
      description: >
        La risorsa indicata non esiste. Vale anche per una risorsa cancellata
        nel frattempo: dal punto di vista di chi chiama i due casi sono lo
        stesso, e distinguerli direbbe a chi prova identificativi a caso quali
        sono stati usati davvero.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 404
            message: Tipologia di camera non trovata
            timestamp: 2026-08-06T10:15:30Z
            data: null

    Conflict:
      description: >
        La richiesta e' formalmente valida ma confligge con lo stato
        attuale della risorsa (es. email gia' registrata).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 409
            message: Email gia' registrata
            timestamp: 2026-08-05T10:15:30Z
            data: null

    TooManyRequests:
      description: >
        Troppi tentativi ravvicinati su un endpoint pubblico e costoso: la
        richiesta viene rifiutata **prima** di essere elaborata, quindi non
        ha nessun effetto. Non e' mai un blocco definitivo, ma un'attesa
        obbligatoria fra un tentativo e il successivo, che raddoppia ad ogni
        tentativo di troppo fino a un tetto e si azzera da sola dopo un
        periodo di inattivita'. Il messaggio indica fra quanto riprovare, ed
        e' l'unico posto in cui l'attesa residua viene comunicata: la busta
        non ha un campo dedicato. Un client che riprova in automatico deve
        leggerlo e aspettare, non insistere.
        Cosa faccia scattare il limite dipende dall'endpoint — sul login i
        tentativi falliti per email e per indirizzo IP, sulla registrazione
        tutte le registrazioni dello stesso indirizzo — ed e' descritto sul
        singolo endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 429
            message: Troppi tentativi di accesso falliti. Riprova fra 8 secondi
            timestamp: 2026-08-05T10:15:30Z
            data: null

    InternalServerError:
      description: >
        Errore inatteso lato server. Il messaggio e' volutamente generico:
        il dettaglio dell'eccezione resta nei log e non viene esposto al
        client.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 500
            message: Si e' verificato un errore imprevisto
            timestamp: 2026-08-05T10:15:30Z
            data: null

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT ottenuto da /api/auth/login, da inviare nell'header
        Authorization come "Bearer <token>".

  schemas:

    RegisterRequest:
      type: object
      description: Dati per la registrazione di un nuovo cliente (frontoffice)
      required:
        - nome
        - cognome
        - email
        - password
        - consensoPrivacy
      properties:
        nome:
          type: string
          minLength: 1
          example: Mario
        cognome:
          type: string
          minLength: 1
          example: Rossi
        email:
          type: string
          format: email
          description: Usata anche come credenziale di login
          example: mario.rossi@example.com
        password:
          type: string
          minLength: 8
          description: Password in chiaro (verra' salvata come hash BCrypt, mai in chiaro)
          example: PasswordSicura123
        telefono:
          type: string
          example: "+39 333 1234567"
        dataNascita:
          type: string
          format: date
          example: "1990-05-20"
        consensoPrivacy:
          type: boolean
          description: >
            Consenso al trattamento dei dati personali (GDPR): deve essere
            true per completare la registrazione. Non e' esprimibile come
            constraint OpenAPI (non esiste un "deve valere true"), quindi
            il vincolo e' verificato nel service, che risponde 400 se il
            consenso non e' stato dato.

    LoginRequest:
      type: object
      description: Credenziali di login, valide sia per clienti (Utente) sia per personale (Staff)
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          example: PasswordSicura123

    AccountSummary:
      type: object
      description: >
        Riepilogo essenziale di un account autenticato (cliente o
        personale): formato unico perche' il login puo' autenticare
        indifferentemente un Utente o uno Staff.
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        ruolo:
          type: string
          description: "Nome del ruolo: ADMIN, STAFF o USER"
          example: USER

    AuthResponse:
      type: object
      description: >
        Token JWT emesso. Solo il token: i dati dell'account non stanno
        qui, si recuperano dall'endpoint dedicato /api/auth/me usando il
        token appena ottenuto.
      properties:
        token:
          type: string
          description: "Token JWT da usare come header: Authorization: Bearer <token>"
        tokenType:
          type: string
          example: Bearer
        expiresInMs:
          type: integer
          format: int64
          description: Scadenza del token in millisecondi da adesso
          example: 3600000

    TipologiaCameraRequest:
      type: object
      description: >
        Dati di una tipologia di camera in scrittura (creazione e
        aggiornamento usano lo stesso schema: una PUT sostituisce l'intera
        risorsa, quindi i campi richiesti sono gli stessi della POST).
        I limiti dichiarati qui non sono decorativi: rispecchiano le colonne
        del database (vedi V1__init_schema.sql). Senza, un nome piu' lungo
        della colonna o un prezzo fuori scala arriverebbero fino a Postgres e
        tornerebbero al client come 500 invece che come 400.
      required:
        - nome
        - capienzaMax
        - prezzoNotte
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Nome commerciale della tipologia. Deve essere unico a meno delle
            maiuscole (vincolo garantito da un indice unico su lower(nome)).
          example: Doppia Superior
        descrizione:
          type: string
          maxLength: 2000
          description: >
            Testo libero mostrato nella scheda del catalogo. La colonna e' un
            TEXT senza limite, ma il limite qui c'e' lo stesso: un campo di
            testo pubblico e senza tetto e' un modo per far scrivere megabyte
            a chiunque abbia il permesso di scrivere.
          example: Camera doppia con vista sul giardino, letto matrimoniale e balcone
        capienzaMax:
          type: integer
          minimum: 1
          description: Numero massimo di persone che possono alloggiare nella camera
          example: 2
        prezzoNotte:
          type: number
          minimum: 0
          maximum: 99999999.99
          description: >
            Prezzo per notte in euro, con **al massimo due decimali**: oltre,
            la risposta e' 400. Il vincolo non e' esprimibile in modo utile
            nello schema (OpenAPI ha multipleOf, ma il generatore Java non lo
            traduce in nessuna annotazione), quindi lo verifica il service —
            come per il consenso privacy in registrazione. Rifiutare e'
            deliberato: la colonna e' NUMERIC(10,2) e accettare il valore
            vorrebbe dire arrotondarlo senza dirlo a chi l'ha scritto.
            **E' il prezzo di listino**, cioe' quello che vale per le notti che
            nessun periodo tariffario copre. Dal 2026-09-01 non e' piu' l'unico
            prezzo che esista: i periodi
            (GET /api/tipologie-camera/{id}/tariffe) lo scavalcano nelle date che
            dichiarano, e dentro un periodo i singoli giorni della settimana
            possono scavalcare a loro volta. Non e' rimasto per compatibilita' —
            e' il livello che garantisce che ogni notte abbia un prezzo, cosi'
            che un albergo con il calendario configurato a meta' venda lo stesso
            invece di smettere di vendere il primo gennaio.
            Il massimo corrisponde a quanto entra nella colonna.
          example: 120.00

    TipologiaCameraResponse:
      type: object
      description: >
        Tipologia di camera come viene restituita al client, dotazioni
        comprese. **Le foto no**: hanno un endpoint proprio
        (GET /api/tipologie-camera/{id}/media) e non compaiono qui.
        Il motivo e' lo stesso che tiene le dotazioni fuori dal fetch
        dell'elenco paginato: sono una collezione, e portarsele dietro in una
        pagina di tipologie vorrebbe dire caricare la galleria di tutte per
        disegnarne le schede. Il prezzo e' una seconda chiamata per la pagina di
        dettaglio, ed e' accettato finche' il catalogo non chiedera' una foto di
        copertina dentro l'elenco: allora sara' quella, sola, a dover entrare
        qui — non l'intera galleria.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Doppia Superior
        descrizione:
          type: string
          example: Camera doppia con vista sul giardino
        capienzaMax:
          type: integer
          example: 2
        prezzoNotte:
          type: number
          description: >
            Prezzo di listino per notte, in euro. **Non e' sempre il prezzo che
            si paga**: nelle date coperte da un periodo tariffario vale quello
            del periodo. Il numero che conta per un soggiorno preciso e'
            l''importoTotale'' che restituisce GET /api/disponibilita per quelle
            date.
          example: 120.00
        dotazioni:
          type: array
          description: >
            Dotazioni assegnate alla tipologia, in ordine alfabetico di nome.
            Array vuoto se non ne ha nessuna. Non si impostano dallo schema di
            scrittura della tipologia ma da
            PUT /api/tipologie-camera/{id}/dotazioni.
          items:
            $ref: '#/components/schemas/DotazioneResponse'

    TipologiaCameraDotazioniRequest:
      type: object
      description: >
        Insieme completo delle dotazioni da assegnare a una tipologia di
        camera. E' una sostituzione, non un'aggiunta: cio' che non compare
        nella lista viene staccato.
      required:
        - dotazioniIds
      properties:
        dotazioniIds:
          type: array
          uniqueItems: true
          maxItems: 100
          description: >
            Id delle dotazioni da assegnare. **Array vuoto = nessuna
            dotazione**, ed e' il modo per toglierle tutte: e' un valore
            legittimo, non un errore. Ripetere lo stesso id non e' un errore
            nemmeno quello — un insieme e' un insieme, e la seconda copia
            viene semplicemente ignorata. Il tetto di 100 elementi c'e' per lo
            stesso motivo del tetto sulle pagine: una lista senza limite e' un
            modo per far fare al server un lavoro deciso da chi chiama.
          items:
            type: integer
            format: int64
            minimum: 1
          example: [1, 2]

    MediaCameraRequest:
      type: object
      description: >
        Foto da aggiungere alla galleria di una tipologia. Un campo solo:
        l'indirizzo dell'immagine. La posizione non c'e' perche' non si sceglie
        — la foto va in fondo — e si sistema poi con l'endpoint di riordino.
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 500
          pattern: '^https?://\S+$'
          description: >
            Indirizzo assoluto dell'immagine, gia' pubblicata altrove: questa
            API tiene l'elenco delle foto e il loro ordine, non i file.
            **Deve cominciare per http:// o https://**, e non e' una
            formalita': il valore finisce dritto nell'attributo src di un tag
            img, quindi accettare uno schema qualunque vorrebbe dire lasciar
            scrivere `javascript:...` a chi puo' scrivere nel catalogo. Il
            vincolo e' sullo **schema** e non pretende di validare l'indirizzo:
            mettere al sicuro il resto — virgolette, angolari — resta lavoro di
            chi disegna la pagina, e dirlo qui e' meglio che lasciar credere il
            contrario.
            Il limite di 500 caratteri ricalca la colonna (vedi
            V1__init_schema.sql).
            Deve essere unica **dentro la tipologia**: la stessa immagine due
            volte nella stessa galleria e' un errore di chi la inserisce, e la
            risposta e' 409. Il confronto **distingue le maiuscole**, al
            contrario di quelli sui nomi delle altre risorse: in un URL sono
            significative, e due indirizzi che differiscono per una lettera
            possono essere due file diversi davvero.
          example: https://cdn.felixhotel.example/camere/doppia-superior/vista.jpg

    MediaCameraOrdineRequest:
      type: object
      description: La galleria di una tipologia, nell'ordine in cui va mostrata
      required:
        - mediaIds
      properties:
        mediaIds:
          type: array
          maxItems: 30
          description: >
            Id delle foto **nell'ordine desiderato**: il primo elemento e' la
            copertina.
            E' un array e non un insieme, al contrario di 'dotazioniIds' della
            tipologia — e la differenza e' voluta. La' l'ordine non significava
            niente e un id ripetuto era solo ridondante, quindi assorbirlo era la
            cosa gentile da fare; qui l'ordine e' tutto il contenuto del
            messaggio, e la stessa foto in due posizioni non vuol dire niente che
            si possa eseguire. Un duplicato e' quindi **400**.
            L'elenco deve contenere **esattamente** le foto che la tipologia ha
            adesso: vedi la descrizione dell'endpoint per il perche' una lista
            parziale venga rifiutata invece che applicata a meta'.
            Il tetto e' lo stesso numero massimo di foto per tipologia.
          items:
            type: integer
            format: int64
            minimum: 1
          example: [3, 7]

    MediaCameraResponse:
      type: object
      description: >
        Foto come viene restituita al client: identificativo e indirizzo, niente
        altro.
        **La posizione non c'e', ed e' deliberato.** In database esiste — la
        colonna 'ordine' — ma e' il modo in cui la sequenza viene conservata, non
        un dato che il client debba leggere: l'ordine gli arriva gia' applicato,
        ed e' l'ordine dell'array. Esporla vorrebbe dire promettere qualcosa sui
        suoi valori — che partano da zero, che non abbiano buchi — che
        l'eliminazione di una foto non mantiene; e un client che si mettesse a
        ordinare per quel numero, invece di fidarsi dell'array, farebbe la stessa
        cosa in un modo che prima o poi si rompe.
      properties:
        id:
          type: integer
          format: int64
          example: 7
        url:
          type: string
          example: https://cdn.felixhotel.example/camere/doppia-superior/vista.jpg

    StatoCamera:
      type: string
      description: >
        Stato operativo di una camera fisica. E' l'inventario del backoffice e
        non dice se la camera sia prenotabile: quello si calcola dalle
        prenotazioni sovrapposte alle date richieste, e OCCUPATA vuol dire
        "c'e' qualcuno dentro adesso", non "e' impegnata a settembre".
      enum:
        - LIBERA
        - OCCUPATA
        - MANUTENZIONE
        - PULIZIA
      example: LIBERA

    CameraRequest:
      type: object
      description: >
        Dati di una camera in scrittura (creazione e aggiornamento usano lo
        stesso schema). I limiti ricalcano le colonne del database, vedi
        V1__init_schema.sql.
        **Lo `stato` e' facoltativo e vale LIBERA se assente.** In creazione e'
        l'unico comportamento sensato — una stanza nuova nasce libera — ma su un
        aggiornamento significa che **ometterlo riporta la camera a LIBERA**
        invece di lasciarla com'era: e' una PUT, non una PATCH, e vale anche
        qui. E' anche il motivo per cui il lavoro quotidiano passa da
        PUT /api/camere/{id}/stato e non da questo schema: da li' una
        dimenticanza non puo' rimettere in servizio una stanza guasta.
      required:
        - numero
        - piano
        - tipologiaCameraId
      properties:
        numero:
          type: string
          minLength: 1
          maxLength: 20
          description: >
            Numero o sigla della camera, come e' scritto sulla porta. Testo e
            non intero: "12A" e "S3" sono numeri di camera veri quanto "101".
            Deve essere unico a meno delle maiuscole (indice su lower(numero),
            vedi V4__unicita_numero_camera.sql).
          example: "101"
        piano:
          type: integer
          minimum: 0
          maximum: 200
          description: >
            Piano su cui si trova. Lo zero e' il piano terra ed e' un valore
            valido; i piani interrati non sono rappresentabili, e finche' non
            esistera' un albergo con le camere sottoterra va bene cosi'. Il
            tetto e' arbitrario ma non inutile: senza, il campo accetta
            due miliardi.
          example: 1
        tipologiaCameraId:
          type: integer
          format: int64
          minimum: 1
          description: >
            Tipologia a cui la camera appartiene. Deve esistere: un id
            sconosciuto e' un **400**, non un 404 — il 404 di questi endpoint
            significa "questa camera non esiste".
          example: 1
        stato:
          $ref: '#/components/schemas/StatoCamera'

    CameraStatoRequest:
      type: object
      description: Nuovo stato operativo di una camera
      required:
        - stato
      properties:
        stato:
          $ref: '#/components/schemas/StatoCamera'

    CameraResponse:
      type: object
      description: Camera fisica come viene restituita al client
      properties:
        id:
          type: integer
          format: int64
          example: 1
        numero:
          type: string
          example: "101"
        piano:
          type: integer
          example: 1
        stato:
          $ref: '#/components/schemas/StatoCamera'
        tipologia:
          $ref: '#/components/schemas/TipologiaCameraSintesi'

    CameraSintesi:
      type: object
      description: >
        Camera fisica ridotta a quel che serve per riconoscerla dentro una
        prenotazione: quale stanza e', a che piano, e di che tipo.
        Non e' CameraResponse per una ragione precisa: quella porta anche lo
        **stato operativo**, che descrive com'e' messa la stanza *adesso* e non
        ha niente a che fare con un soggiorno di tre mesi fa. Una prenotazione
        che mostrasse "OCCUPATA" accanto a un check-out del 13 settembre
        starebbe dicendo una cosa vera su un'altra domanda.
        **La tipologia c'e' e non e' ridondante** rispetto a quella della
        prenotazione: le due possono differire. Il cliente compra una tipologia,
        ma chi sta al banco puo' assegnargli a mano una stanza di categoria
        diversa — un upgrade — e allora e' proprio qui che la differenza si
        vede, invece di restare un fatto che conosce solo il database.
      properties:
        id:
          type: integer
          format: int64
          example: 4
        numero:
          type: string
          example: "101"
        piano:
          type: integer
          example: 1
        tipologia:
          $ref: '#/components/schemas/TipologiaCameraSintesi'

    TipologiaCameraSintesi:
      type: object
      description: >
        Tipologia ridotta a quel che serve per riconoscerla dentro un'altra
        risorsa. Non e' TipologiaCameraResponse per scelta: quella porta con se'
        prezzo, descrizione e l'elenco delle dotazioni, e un elenco di cinquanta
        camere se le trascinerebbe dietro cinquanta volte per mostrare un nome.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Doppia Superior

    StatoPrenotazione:
      type: string
      description: >
        Punto del ciclo di vita in cui si trova una prenotazione.
        Il percorso normale e' IN_ATTESA -> CONFERMATA -> CHECK_IN ->
        CHECK_OUT; da IN_ATTESA e da CONFERMATA si puo' uscire per ANNULLATA.
        **Solo CONFERMATA, CHECK_IN e CHECK_OUT occupano una camera**: IN_ATTESA
        e' il carrello e non riserva niente, ANNULLATA ha restituito il posto.
        **CHECK_OUT occupa anche se l'ospite se n'e' andato**: il suo periodo e'
        passato, quindi non toglie niente a chi prenota per il futuro, e
        toglierlo dal conteggio vorrebbe dire che una notte gia' venduta
        risulterebbe libera a chi guarda indietro.
      enum:
        - IN_ATTESA
        - CONFERMATA
        - CHECK_IN
        - CHECK_OUT
        - ANNULLATA
      example: CONFERMATA

    CanalePrenotazione:
      type: string
      description: >
        Da dove e' arrivata la prenotazione. Serve al backoffice per sapere di
        cosa e' fatto il proprio riempimento, e non e' un dato che il cliente
        sceglie: una prenotazione fatta dal sito e' ONLINE per costruzione, gli
        altri tre valori li puo' indicare solo il personale che la registra.
      enum:
        - ONLINE
        - TELEFONO
        - WALK_IN
        - AGENZIA
      example: ONLINE

    PrenotazioneRequest:
      type: object
      description: >
        Dati per aprire una prenotazione. I limiti ricalcano le colonne del
        database, vedi V1__init_schema.sql.
        **Due campi valgono in un caso e sono vietati nell'altro**: `utenteId` e
        `canale` servono a chi registra la prenotazione di qualcun altro
        (STAFF/ADMIN) e vanno omessi da un cliente che prenota per se'. Sono
        obbligatori nel primo caso e rifiutati con 400 nel secondo: chi ha il
        token USER non puo' intestare una prenotazione a un altro, e ignorarli in
        silenzio direbbe che ci ha provato senza dirgli che non ha funzionato.
        Cosa non e' esprimibile qui e lo verifica il service: il **check-in non
        puo' essere nel passato**, il **numero di ospiti non puo' superare la
        capienza** della tipologia scelta, e per quel periodo **deve esserci una
        camera libera**.
      required:
        - tipologiaCameraId
        - dataCheckIn
        - dataCheckOut
        - numeroOspiti
      properties:
        tipologiaCameraId:
          type: integer
          format: int64
          minimum: 1
          description: >
            Tipologia che si prenota — non la singola camera: quale stanza
            tocchera' si decide al check-in. Deve esistere: un id sconosciuto e'
            un **400**, non un 404, perche' il 404 di questi endpoint significa
            "questa prenotazione non esiste".
          example: 1
        dataCheckIn:
          type: string
          format: date
          description: >
            Giorno di arrivo. Non puo' essere nel passato: il vincolo non e'
            esprimibile nello schema (dipende da che giorno e' oggi) e lo
            verifica il service, che risponde 400.
          example: 2026-09-10
        dataCheckOut:
          type: string
          format: date
          description: >
            Giorno di partenza, che deve essere **successivo** al check-in — un
            soggiorno di zero notti non esiste. Il vincolo e' anche nel database
            (CHECK chk_prenotazione_date), ma a rifiutarlo con un 400 e' il
            service: lasciarlo arrivare fino a Postgres lo trasformerebbe in un
            500.
            Il giorno di partenza **non e' occupato**: chi parte il 13 libera la
            camera per chi arriva il 13.
          example: 2026-09-13
        numeroOspiti:
          type: integer
          minimum: 1
          maximum: 50
          description: >
            Quante persone alloggeranno. Non puo' superare la capienza della
            tipologia scelta — quel confronto lo fa il service, perche' il
            massimo dipende da quale tipologia si e' scelta e non e' un numero
            fisso. Il tetto dichiarato qui e' invece una difesa grossolana:
            senza, il campo accetta due miliardi di ospiti.
          example: 2
        note:
          type: string
          maxLength: 1000
          description: >
            Richieste o annotazioni libere del cliente (orario di arrivo, culla,
            piano alto). Non e' un campo che l'applicazione interpreta: e' un
            promemoria per chi accoglie.
          example: Arrivo in tarda serata
        utenteId:
          type: integer
          format: int64
          minimum: 1
          description: >
            Cliente a cui intestare la prenotazione. **Solo per STAFF e ADMIN**,
            dove e' obbligatorio; da un USER e' un 400. Deve corrispondere a un
            account esistente, altrimenti 400.
          example: 7
        canale:
          $ref: '#/components/schemas/CanalePrenotazione'

    PrenotazioneCheckInRequest:
      type: object
      description: >
        Corpo facoltativo del check-in. Senza, la camera la sceglie il backend
        fra quelle assegnabili della tipologia prenotata, prendendo il numero
        piu' basso — che e' il caso normale e non richiede di dire niente.
        Serve solo quando chi sta al banco vuole una stanza **precisa**: una
        richiesta del cliente, un piano da evitare, un upgrade.
      properties:
        cameraId:
          type: integer
          format: int64
          minimum: 1
          description: >
            La camera da assegnare, invece di lasciar scegliere il backend.
            Deve esistere (altrimenti **400**), essere **LIBERA** e non avere
            dentro un ospite in quelle notti (altrimenti **409**). I due
            controlli non sono lo stesso detto due volte: lo stato operativo lo
            scrive anche una persona e puo' essere sbagliato, le prenotazioni in
            CHECK_IN le scrive solo l'applicazione.
            **Puo' essere di una tipologia diversa da quella prenotata**: e'
            l'upgrade, ed e' consentito di proposito perche' e' cosi' che un
            albergo risolve un guasto o un pienone. Quel che **non** cambia e'
            l'importo: il totale e' una fotografia presa alla creazione e resta
            quello della tipologia comprata. Un upgrade deciso al banco e' un
            gesto commerciale, e se costasse di piu' non sarebbe un upgrade.
          example: 4

    PrenotazioneAnnullamentoRequest:
      type: object
      description: >
        Corpo facoltativo dell'annullamento: serve solo a dire perche'. Senza,
        la prenotazione viene annullata lo stesso e il motivo resta null —
        obbligare a scrivere una ragione produrrebbe soltanto stringhe come
        "annullata".
      properties:
        motivo:
          type: string
          maxLength: 255
          description: Perche' la prenotazione e' stata annullata, in testo libero
          example: Cambio di programma del cliente

    PrenotazioneResponse:
      type: object
      description: >
        Prenotazione come viene restituita al client.
        **La camera fisica compare solo dopo il check-in**: prima di allora e'
        null, e non perche' manchi un dato — perche' quella decisione non e'
        ancora stata presa. Si prenota una tipologia, si dorme in una stanza.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        dataCheckIn:
          type: string
          format: date
          example: 2026-09-10
        dataCheckOut:
          type: string
          format: date
          example: 2026-09-13
        numeroOspiti:
          type: integer
          example: 2
        stato:
          $ref: '#/components/schemas/StatoPrenotazione'
        canale:
          $ref: '#/components/schemas/CanalePrenotazione'
        importoTotale:
          type: number
          description: >
            Totale del soggiorno in euro: **la somma delle notti, una per una**.
            Dal 2026-09-01 non e' piu' una moltiplicazione — ogni notte vale il
            prezzo del periodo tariffario che la copre, del giorno della settimana
            se quel periodo ne dichiara uno, o il listino della tipologia se
            nessun periodo la copre.
            **La fotografia resta, cambia solo chi la scatta**: e' presa alla
            creazione e non e' un calcolo rifatto ad ogni lettura, quindi se
            domani il listino cambia questa prenotazione continua a valere quel
            che valeva quando e' stata fatta.
          example: 360.00
        note:
          type: string
          example: Arrivo in tarda serata
        utente:
          $ref: '#/components/schemas/UtenteSintesi'
        tipologia:
          $ref: '#/components/schemas/TipologiaCameraSintesi'
        camera:
          $ref: '#/components/schemas/CameraSintesi'
        gestitaDa:
          $ref: '#/components/schemas/StaffSintesi'
        motivoCancellazione:
          type: string
          description: Valorizzato solo su una prenotazione ANNULLATA, e solo se un motivo era stato indicato
          example: Cambio di programma del cliente
        dataCancellazione:
          type: string
          format: date-time
          description: Quando e' stata annullata. Valorizzato solo su una prenotazione ANNULLATA
        dataCreazione:
          type: string
          format: date-time
          description: Quando la prenotazione e' stata aperta

    TipoDocumento:
      type: string
      description: >
        Che documento e' stato esibito al banco. L'elenco ricalca quello che la
        Questura accetta sulla schedina alloggiati per un ospite maggiorenne, ed
        e' volutamente corto: sono i quattro documenti che una reception vede
        davvero.
        **Il database non lo verifica**, al contrario di 'stato' e 'canale' su
        prenotazione: la colonna 'ospite.tipo_documento' e' un VARCHAR(30) senza
        CHECK fin dal V1. Il vincolo esiste solo qui e nell'enum Java che ne
        nasce, il che vuol dire che una INSERT a mano puo' scriverci quel che
        vuole — e che aggiungere un valore all'elenco non richiede una migration,
        ma toglierne uno non ripulisce le righe gia' scritte.
      enum:
        - CARTA_IDENTITA
        - PASSAPORTO
        - PATENTE
        - PERMESSO_SOGGIORNO
      example: CARTA_IDENTITA

    OspiteRequest:
      type: object
      description: >
        Una persona che soggiorna, con il documento che ha esibito. I limiti
        ricalcano le colonne del database, vedi V1__init_schema.sql e
        V10__ospite_minori.sql.
        **Lo stesso schema serve alla creazione e alla correzione**, al contrario
        di quanto fa lo staff: qui non c'e' nessun campo che abbia senso una
        volta sola: un ospite e' fatto tutto di dati che si possono aver digitati
        storti, e nessuno di essi si "sceglie alla nascita" come una password.
        **Il documento e' obbligatorio per chi e' maggiorenne il giorno
        dell'arrivo, e non lo e' per un minorenne**: questo schema non sa dirlo,
        perche' la regola dipende dalla data di check-in della prenotazione, che
        sta nell'URL e non nel corpo. Chi la applica e' il server, e chi non la
        rispetta prende un **400** — vedi la descrizione di 'tipoDocumento'.
      required:
        - nome
        - cognome
        - dataNascita
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Come sta scritto sul documento, non come la persona si presenta:
            questa riga finisce in un registro che qualcun altro puo' venire a
            leggere.
          example: Mario
        cognome:
          type: string
          minLength: 1
          maxLength: 100
          example: Rossi
        tipoDocumento:
          allOf:
            - $ref: '#/components/schemas/TipoDocumento'
          description: >
            **Obbligatorio se l'ospite e' maggiorenne alla data di arrivo della
            prenotazione, altrimenti si omette.** Un minorenne non ha un
            documento di riconoscimento proprio e negli alberghi si registra
            sotto chi lo accompagna: pretenderne uno vorrebbe dire farselo
            inventare al banco, e un dato inventato in un registro di legge e'
            peggio di un dato mancante — nessuno puo' piu' distinguerlo da uno
            vero.
            **Va insieme a 'numeroDocumento'**: o ci sono tutti e due o non c'e'
            nessuno dei due, altrimenti e' **400**. Un tipo senza numero e' mezzo
            dato, e chi lo rilegge non sa se il numero manchi perche' non esiste
            o perche' qualcuno si e' fermato a meta' del modulo.
            **Un minorenne che il documento ce l'ha lo puo' dare**: la regola dice
            che non e' obbligatorio, non che sia vietato.
        numeroDocumento:
          type: string
          minLength: 1
          maxLength: 50
          description: >
            **Obbligatorio insieme a 'tipoDocumento' e alle stesse condizioni.**
            Il numero come sta scritto sul documento. **Distingue le maiuscole**,
            come gli url delle foto e al contrario dei nomi di tipologie,
            dotazioni e camere: non e' un nome che una persona scrive a modo suo,
            e' una stringa stampata da un'autorita' che la considera esatta cosi'
            com'e'.
            Deve essere libero **dentro questa prenotazione**: la stessa persona
            registrata due volte non e' un ospite in piu' (vedi la descrizione
            della POST per il perche' quel doppione fa danno invece di essere
            solo ridondante).
          example: CA12345AB
        dataNascita:
          type: string
          format: date
          description: >
            **Obbligatoria**, e fino al V10 era invece l'unico campo facoltativo
            dello schema. L'inversione ha una ragione sola: e' questo campo a
            dire se il documento ci debba essere. Finche' poteva mancare,
            l'assenza del documento non si poteva ne' accettare ne' rifiutare
            senza indovinare — "e' un bambino" e "il modulo e' incompleto"
            avevano lo stesso aspetto.
            Serve anche a distinguere due omonimi, e ci si appoggera' l'esenzione
            per eta' della tassa di soggiorno.
            **Una data nel futuro e' un 400.** Nessun altro controllo: quanti
            anni debba avere un ospite non lo decide questo contratto, e una data
            molto indietro nel tempo rende semmai il documento obbligatorio, cioe'
            sbaglia dalla parte severa.
          example: 1985-04-17

    OspiteResponse:
      type: object
      description: >
        Un ospite come viene restituito al client: i suoi dati e basta.
        **La prenotazione non c'e'**, come la tipologia non compare nelle foto:
        sta gia' nell'URL di chi ha chiesto, e ripeterla vorrebbe dire mandare
        indietro un dato che il chiamante ha appena scritto.
        **Il numero di documento c'e' per intero**, non mascherato. Non e' una
        svista: questa rotta la raggiungono solo STAFF e ADMIN, cioe' chi il
        documento l'ha appena avuto in mano, e un numero mascherato renderebbe
        impossibile l'unica cosa per cui si rileggerebbe la lista — controllare
        di averlo digitato bene. Se un domani questi dati dovessero comparire
        altrove, e' qui che va guardato per primo.
      properties:
        id:
          type: integer
          format: int64
          example: 12
        nome:
          type: string
          example: Mario
        cognome:
          type: string
          example: Rossi
        tipoDocumento:
          allOf:
            - $ref: '#/components/schemas/TipoDocumento'
          description: >
            Null se l'ospite e' un minorenne registrato senza documento proprio.
            Insieme a 'numeroDocumento': o ci sono tutti e due o nessuno dei due.
        numeroDocumento:
          type: string
          description: Null insieme a 'tipoDocumento', per lo stesso motivo.
          example: CA12345AB
        dataNascita:
          type: string
          format: date
          description: >
            Sempre valorizzata dal V10. **Senza 'nullable: true'**, che sarebbe
            venuto spontaneo scrivere qui e non c'e' in nessun altro schema di
            questo contratto: il generatore lo traduce in un JsonNullable, cioe'
            un tipo che distingue "assente" da "null" e si serializza in modo
            diverso da tutti gli altri campi facoltativi del progetto — 'note' e
            'camera' su PrenotazioneResponse, per dirne due. Quella distinzione
            qui non serve a nessuno, e pagarla vorrebbe dire un campo che si
            legge diversamente dagli altri per una differenza che il client non
            usa.
          example: 1985-04-17

    DisponibilitaTipologia:
      type: object
      description: >
        Una tipologia vista attraverso un periodo: cos'e', quante camere ne
        restano in quei giorni, e quanto verrebbe a costare.
        **La tipologia e' quella intera e non la sintesi**, al contrario di
        quanto succede dentro una prenotazione: li' serve solo a riconoscerla,
        qui e' cio' su cui il cliente sta decidendo, quindi servono descrizione,
        prezzo e dotazioni.
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaCameraResponse'
        camereDisponibili:
          type: integer
          description: >
            Camere libere per **tutto** il periodo richiesto, cioe' quante ne
            restano nella notte piu' affollata. **Zero e' un valore legittimo**
            e vuol dire esaurito, non "errore": la tipologia compare lo stesso,
            perche' sapere che esiste ed e' finita e' diverso dal non vederla.
          example: 3
        importoTotale:
          type: number
          description: >
            Quanto costerebbe il soggiorno: **la somma delle notti, una per una**.
            Dal 2026-09-01 non e' piu' una moltiplicazione: ogni notte vale il
            prezzo del suo giorno della settimana se il periodo che la copre ne
            dichiara uno, altrimenti il prezzo base di quel periodo, altrimenti il
            listino della tipologia. Due notti dello stesso soggiorno possono
            quindi costare diversamente, ed e' il motivo per cui qui c'e' un
            totale e non un prezzo unitario da moltiplicare.
            E' **il preventivo di oggi**, non un impegno — il totale che vale e'
            quello fotografato alla creazione della prenotazione, e se il listino
            cambia in mezzo i due numeri possono differire.
            Compare anche sulle tipologie esaurite: e' il prezzo di quella
            camera per quel periodo, e non dipende da quante ne restano.
          example: 360.00
        soggiornoMinimo:
          type: integer
          description: >
            Quante notti bisogna fermarsi come minimo per poter prenotare questa
            tipologia con questo arrivo. **Uno vuol dire nessun vincolo.**
            Lo decide il periodo tariffario che copre la **notte di arrivo**, non
            il piu' severo fra quelli che il soggiorno attraversa.
            Compare qui perche' un soggiorno piu' corto viene rifiutato dalla
            creazione con un 400, e senza questo numero il client non avrebbe
            modo di saperlo prima di provare. **La ricerca non toglie le righe
            che non lo rispettano**, per la stessa ragione per cui non toglie le
            esaurite: sapere che la Suite esiste ma vuole tre notti e'
            un'informazione, non vederla affatto non lo e'.
          example: 1

    UtenteSintesi:
      type: object
      description: >
        Cliente ridotto a quel che serve per riconoscerlo dentro un'altra
        risorsa. Non e' l'account completo per scelta: password, consensi e date
        di registrazione non hanno niente a che fare con una prenotazione, e
        farli passare di qui vorrebbe dire esporli ad ogni elenco.
      properties:
        id:
          type: integer
          format: int64
          example: 7
        nome:
          type: string
          example: Mario
        cognome:
          type: string
          example: Rossi
        email:
          type: string
          format: email
          description: >
            Serve al personale per riconoscere il cliente e per contattarlo. E'
            visibile solo a chi ha diritto di vedere la prenotazione, che per un
            USER vuol dire soltanto le proprie.
          example: mario.rossi@example.com

    StaffSintesi:
      type: object
      description: >
        Membro del personale ridotto a quel che serve per sapere chi ha fatto
        cosa. **Senza email**, al contrario di UtenteSintesi: qui l'indirizzo
        non servirebbe a nessuno scopo del client, e un dato di un dipendente che
        non serve e' un dato che non si manda.
      properties:
        id:
          type: integer
          format: int64
          example: 3
        nome:
          type: string
          example: Anna
        cognome:
          type: string
          example: Bianchi

    RuoloStaff:
      type: string
      description: >
        Ruolo di un account del backoffice. Sono **due e non tre**: USER e' il
        ruolo dei clienti, che vivono in un'altra tabella e nascono dalla
        registrazione pubblica. Assegnarlo a un account del personale
        produrrebbe una riga che il resto dell'applicazione non sa piu' leggere
        — dentro `staff`, ma senza nessuno dei privilegi per cui quella tabella
        esiste — quindi non e' un valore che questo contratto accetta.
      enum:
        - ADMIN
        - STAFF
      example: STAFF

    StaffRequest:
      type: object
      description: >
        Dati per creare un account del personale. I limiti ricalcano le colonne
        del database, vedi V1__init_schema.sql.
        **Non e' lo stesso schema dell'aggiornamento**, al contrario di quanto
        fanno camere e dotazioni: qui c'e' la password, che si sceglie una volta
        alla nascita dell'account e poi si cambia dal suo endpoint. Un unico
        schema con la password facoltativa direbbe che ometterla in creazione e'
        lecito, e non lo e'.
      required:
        - nome
        - cognome
        - email
        - password
        - ruolo
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
          example: Anna
        cognome:
          type: string
          minLength: 1
          maxLength: 100
          example: Bianchi
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            Usata anche come credenziale di login. Deve essere libera su
            **entrambe** le popolazioni — clienti e personale — perche' il login
            e' uno solo per tutto il progetto e cerca in tutte e due. Il
            confronto ignora le maiuscole (indice su lower(email), vedi
            V6__unicita_email_case_insensitive.sql): un indirizzo gia' preso
            e' un 409 anche se scritto con maiuscole diverse.
          example: anna.bianchi@felixhotel.it
        password:
          type: string
          minLength: 8
          description: >
            Password in chiaro, scelta da chi crea l'account e da comunicare
            alla persona (verra' salvata come hash BCrypt, mai in chiaro).
          example: PasswordSicura123
        telefono:
          type: string
          maxLength: 30
          example: "+39 333 1234567"
        dataAssunzione:
          type: string
          format: date
          description: >
            Facoltativa: e' un dato del fascicolo, non una condizione per
            lavorare. Un account creato in fretta al primo giorno non deve
            aspettare che qualcuno cerchi la data del contratto.
          example: "2024-03-01"
        ruolo:
          $ref: '#/components/schemas/RuoloStaff'

    StaffAggiornamentoRequest:
      type: object
      description: >
        Dati modificabili di un account del personale. E' StaffRequest **senza
        la password**, che si cambia da PUT /api/staff/{id}/password, e senza
        `attivo`, che si cambia da PUT /api/staff/{id}/attivazione.
        E' una PUT: un campo facoltativo omesso viene azzerato, non lasciato
        com'era.
      required:
        - nome
        - cognome
        - email
        - ruolo
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
          example: Anna
        cognome:
          type: string
          minLength: 1
          maxLength: 100
          example: Bianchi
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            Cambiare l'email cambia la credenziale di login. Vale lo stesso
            vincolo della creazione: libera su entrambe le popolazioni, a meno
            delle maiuscole.
          example: anna.bianchi@felixhotel.it
        telefono:
          type: string
          maxLength: 30
          example: "+39 333 1234567"
        dataAssunzione:
          type: string
          format: date
          example: "2024-03-01"
        ruolo:
          $ref: '#/components/schemas/RuoloStaff'

    StaffAttivazioneRequest:
      type: object
      description: Nuovo stato di attivazione di un account del personale
      required:
        - attivo
      properties:
        attivo:
          type: boolean
          description: >
            true riapre l'accesso, false lo chiude. Non cancella niente: le
            prenotazioni gestite dall'account restano intestate a lui.
          example: false

    StaffPasswordRequest:
      type: object
      description: >
        Nuova password di un account del personale. Non chiede quella
        precedente: chi usa questo endpoint e' un ADMIN che sta rimediando per
        conto d'altri, non il titolare che si ricorda la sua.
      required:
        - password
      properties:
        password:
          type: string
          minLength: 8
          description: Password in chiaro (verra' salvata come hash BCrypt, mai in chiaro)
          example: PasswordSicura123

    StaffResponse:
      type: object
      description: >
        Account del personale come viene restituito alla gestione del backoffice.
        **Porta l'email**, al contrario di StaffSintesi, e non e' una
        contraddizione: li' il personale compare dentro la prenotazione che ha
        gestito, e l'indirizzo di un dipendente non serve a chi guarda quella;
        qui la risorsa **e'** l'account, l'email ne e' la credenziale di accesso,
        e un ADMIN che gestisce gli account senza vederla non puo' fare il suo
        lavoro.
        Non porta invece nessuna forma della password, nemmeno l'hash: quello
        non esce da questa applicazione.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Anna
        cognome:
          type: string
          example: Bianchi
        email:
          type: string
          format: email
          example: anna.bianchi@felixhotel.it
        telefono:
          type: string
          example: "+39 333 1234567"
        dataAssunzione:
          type: string
          format: date
          example: "2024-03-01"
        ruolo:
          $ref: '#/components/schemas/RuoloStaff'
        attivo:
          type: boolean
          description: Se false l'account esiste ma non puo' piu' autenticarsi
          example: true

    DotazioneRequest:
      type: object
      description: >
        Dati di una dotazione in scrittura (creazione e aggiornamento usano lo
        stesso schema: una PUT sostituisce l'intera risorsa, quindi i campi
        richiesti sono gli stessi della POST).
        I limiti dichiarati qui rispecchiano le colonne del database (vedi
        V1__init_schema.sql): senza, un valore fuori misura arriverebbe fino a
        Postgres e tornerebbe al client come 500 invece che come 400.
      required:
        - nome
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Nome della dotazione, mostrato nella scheda della camera. Deve
            essere unico a meno delle maiuscole (vincolo garantito da un
            indice unico su lower(nome), vedi
            V3__unicita_nome_dotazione.sql).
          example: Wi-Fi
        descrizione:
          type: string
          maxLength: 255
          description: >
            Dettaglio facoltativo di cosa comprende la dotazione. Il limite
            ricalca la colonna VARCHAR(255).
          example: Connessione senza fili gratuita in tutta la struttura

    DotazioneResponse:
      type: object
      description: Dotazione come viene restituita al client
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Wi-Fi
        descrizione:
          type: string
          example: Connessione senza fili gratuita in tutta la struttura

    ImpostazioniHotelRequest:
      type: object
      description: >
        Dati della struttura in scrittura. I limiti ricalcano le colonne del
        database (V1__init_schema.sql per i primi sei campi,
        V8__identita_struttura.sql per quelli aggiunti dalla fase 2): senza, un
        valore fuori misura arriverebbe fino a Postgres e tornerebbe al client
        come 500 invece che come 400.
        **Obbligatori solo i tre campi che il V1 dichiara NOT NULL**: nome e i
        due orari. Tutto il resto e' facoltativo — un albergo che sta
        configurando il gestionale ha il proprio nome prima di avere sottomano
        il codice ISTAT del comune, e obbligarlo a cercarlo per salvare il
        numero di telefono renderebbe la schermata inutilizzabile.
        **Sui codici non c'e' nessuna validazione di formato oltre alla
        lunghezza**, ed e' una scelta dichiarata: la partita IVA di una societa'
        estera, un codice fiscale di persona fisica e la numerazione di
        Alloggiati Web non hanno la stessa forma, e un pattern scritto su quella
        italiana rifiuterebbe valori legittimi. Chi li inserisce li legge da un
        documento; la verifica vera la fa il servizio che li riceve.
      required:
        - nome
        - orarioCheckInDefault
        - orarioCheckOutDefault
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 200
          description: Nome commerciale della struttura, quello che il sito mostra.
          example: Felix Hotel
        indirizzo:
          type: string
          maxLength: 300
          example: Via Roma 1, 47921 Rimini (RN)
        telefono:
          type: string
          maxLength: 30
          example: "+39 0541 123456"
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            Indirizzo di contatto pubblico della struttura. **Non e' una
            credenziale**: non ha niente a che vedere con le email degli account
            e non deve essere unica.
          example: info@felixhotel.it
        orarioCheckInDefault:
          type: string
          format: time
          description: >
            Ora a partire dalla quale la struttura consegna le camere.
            **E' un'informazione, non un vincolo**: nessun endpoint la applica —
            PUT /api/prenotazioni/{id}/check-in registra l'arrivo in qualunque
            momento della giornata. Serve a chi legge il sito e a chi sta al
            banco.
            **In ingresso i secondi sono facoltativi** ("14:00" e "14:00:00"
            valgono uguale), mentre **in risposta ci sono sempre**: e' come
            Jackson serializza un LocalTime, ed e' scritto qui perche' gli
            esempi delle due parti sembrano altrimenti incoerenti.
          example: "14:00"
        orarioCheckOutDefault:
          type: string
          format: time
          description: Ora entro la quale la camera va liberata. Informativa come la precedente.
          example: "10:00"
        ragioneSociale:
          type: string
          maxLength: 200
          description: >
            Denominazione legale di chi gestisce la struttura, che spesso non
            coincide col nome commerciale. Serve alle fatture.
          example: Felix Hotel S.r.l.
        partitaIva:
          type: string
          maxLength: 20
          description: Partita IVA di chi emette le fatture. Nessun controllo di formato, vedi sopra.
          example: "01234567890"
        codiceFiscale:
          type: string
          maxLength: 16
          description: >
            Codice fiscale del titolare o della societa'. Per una societa'
            coincide di norma con la partita IVA, ma non sempre — sono due campi
            perche' sono due dati.
          example: "01234567890"
        cin:
          type: string
          maxLength: 30
          description: >
            Codice Identificativo Nazionale della struttura ricettiva. Va
            esposto negli annunci e nelle comunicazioni.
          example: IT099014B4XYZW1234
        comune:
          type: string
          maxLength: 100
          description: Comune in cui la struttura si trova, per esteso.
          example: Rimini
        codiceIstatComune:
          type: string
          maxLength: 6
          description: >
            Codice ISTAT del comune, sei cifre. E' la chiave con cui si
            identifica il comune nelle rilevazioni statistiche e nel calcolo
            della tassa di soggiorno, che cambia da comune a comune.
          example: "099014"
        codiceStrutturaAlloggiati:
          type: string
          maxLength: 20
          description: >
            Identificativo assegnato dalla Questura per l'invio delle schedine
            ad Alloggiati Web. Senza, le schedine non si possono trasmettere.
          example: "RN012345"

    ImpostazioniHotelResponse:
      type: object
      description: >
        Impostazioni complete della struttura, come le vede un ADMIN.
        **Non porta l'id**, al contrario di ogni altra risposta del progetto: la
        riga e' una sola e non c'e' nessuna rotta che la indirizzi per id, quindi
        pubblicarlo direbbe che esiste una collezione da cui sceglierla.
      properties:
        nome:
          type: string
          example: Felix Hotel
        indirizzo:
          type: string
          example: Via Roma 1, 47921 Rimini (RN)
        telefono:
          type: string
          example: "+39 0541 123456"
        email:
          type: string
          format: email
          example: info@felixhotel.it
        orarioCheckInDefault:
          type: string
          format: time
          example: "14:00:00"
        orarioCheckOutDefault:
          type: string
          format: time
          example: "10:00:00"
        ragioneSociale:
          type: string
          example: Felix Hotel S.r.l.
        partitaIva:
          type: string
          example: "01234567890"
        codiceFiscale:
          type: string
          example: "01234567890"
        cin:
          type: string
          example: IT099014B4XYZW1234
        comune:
          type: string
          example: Rimini
        codiceIstatComune:
          type: string
          example: "099014"
        codiceStrutturaAlloggiati:
          type: string
          example: "RN012345"

    ImpostazioniHotelPubblicheResponse:
      type: object
      description: >
        Il sottoinsieme delle impostazioni che chiunque puo' leggere: nome,
        indirizzo, recapiti e orari.
        **E' uno schema separato e non lo stesso con dei campi vuoti.** La
        differenza conta: qui i campi fiscali non esistono, quindi non c'e'
        nessun punto del codice in cui qualcuno possa dimenticarsi di
        cancellarli. Un DTO solo con i campi riservati messi a null avrebbe
        funzionato allo stesso modo finche' nessuno aggiunge un campo — e il
        giorno che qualcuno lo aggiunge, quel campo esce pubblico senza che
        nessuno l'abbia deciso.
      properties:
        nome:
          type: string
          example: Felix Hotel
        indirizzo:
          type: string
          example: Via Roma 1, 47921 Rimini (RN)
        telefono:
          type: string
          example: "+39 0541 123456"
        email:
          type: string
          format: email
          example: info@felixhotel.it
        orarioCheckInDefault:
          type: string
          format: time
          example: "14:00:00"
        orarioCheckOutDefault:
          type: string
          format: time
          example: "10:00:00"

    ApiBaseResponse:
      type: object
      description: >
        Busta di risposta standard di TUTTI gli endpoint non paginati:
        status, messaggio, timestamp e il payload in 'data'. E' l'unica
        busta non paginata del progetto — non si dichiara un envelope per
        endpoint. Quale oggetto arrivi dentro 'data' e' indicato nella
        description del singolo endpoint (OpenAPI non ha i generics: non
        c'e' modo di scrivere qui "data: T" e tenere insieme un solo
        schema).
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: integer
          description: Codice di stato HTTP
          example: 200
        message:
          type: string
          description: Messaggio leggibile, di successo o di errore
          example: Operazione completata con successo
        timestamp:
          type: string
          format: date-time
          description: Istante in cui e' stata generata la risposta
        data:
          type: object
          description: >
            Payload della risposta: l'oggetto (o l'array) richiesto, null
            in caso di errore. Il tipo concreto e' documentato nella
            description dell'endpoint che restituisce questa busta.
            Unica eccezione al "null in caso di errore": sugli errori di
            validazione (400) 'data' porta la mappa nome-campo ->
            messaggio dei campi rifiutati.

    ApiBaseResponsePaginated:
      description: >
        Come ApiBaseResponse, ma per gli endpoint il cui 'data' e' una
        pagina di risultati: aggiunge 'page' con i metadati di
        paginazione. Schema separato (invece di 'page' sempre presente ma
        nullable) cosi' le risposte non paginate non portano un campo
        inutile.
      allOf:
        - $ref: '#/components/schemas/ApiBaseResponse'
        - type: object
          properties:
            page:
              $ref: '#/components/schemas/PageInfo'

    PageInfo:
      type: object
      description: Metadati di paginazione
      properties:
        pageNumber:
          type: integer
          description: Numero di pagina corrente (0-based)
          example: 0
        pageSize:
          type: integer
          description: Dimensione della pagina
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Numero totale di elementi su tutte le pagine
          example: 134
        totalPages:
          type: integer
          description: Numero totale di pagine
          example: 7

    PrezzoGiorno:
      type: object
      description: >
        Il prezzo di un giorno preciso della settimana dentro un periodo
        tariffario: "in alta stagione il sabato costa 210 invece di 180".
        **Si chiama PrezzoGiorno e non PrezzoGiornoSettimana**, che sarebbe stato
        il nome naturale, solo per non generare una classe omonima dell'entita'
        che ha lo stesso ruolo: il progetto ne ha gia' una coppia cosi'
        (StatoCamera) ed e' un fastidio ricorrente in ogni file che le usa
        entrambe. Costa una parola in meno qui e nessun import qualificato altrove.
        **E' uno scavalcamento, non un listino completo**: i giorni che non
        compaiono costano il 'prezzoNotte' del periodo, e il caso normale sono
        una o due righe. Non serve elencarli tutti e sette.
        **Perche' non due campi 'prezzoFeriale' e 'prezzoWeekend'**, che sarebbero
        stati molto piu' brevi: quella forma pretende che "quali giorni sono
        weekend" sia scritto nel programma, e due alberghi lo vogliono diverso —
        un rifugio di montagna ha il picco venerdi' e sabato, un hotel di citta'
        che vive di trasferte ce l'ha dal lunedi' al giovedi'.
      required:
        - giorno
        - prezzo
      properties:
        giorno:
          type: string
          description: >
            Il giorno della settimana, con i nomi di java.time.DayOfWeek. Lo
            stesso giorno non puo' comparire due volte nello stesso periodo:
            sarebbero due prezzi per lo stesso sabato, senza nessun criterio per
            sceglierne uno.
          enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          example: SATURDAY
        prezzo:
          type: number
          description: >
            Quanto costa una notte di quel giorno, in euro.
            **Sostituisce il prezzo base del periodo, non ci si somma**: scrivere
            30 vuol dire che quel giorno costa trenta euro, non trenta euro in
            piu' — la differenza vale la pena leggerla prima di configurare un
            weekend.
            Al massimo **due decimali**: la colonna e' NUMERIC(10,2) e un terzo
            decimale verrebbe troncato in silenzio, quindi viene rifiutato (il
            vincolo vive nel Service, OpenAPI non sa esprimerlo).
          minimum: 0
          maximum: 99999999.99
          example: 210.00

    PeriodoTariffarioRequest:
      type: object
      description: >
        Un intervallo di date in cui una tipologia costa un certo prezzo a notte.
        **Gli estremi sono compresi tutti e due e si contano in notti**: dal 1 al
        31 agosto sono la notte del 1 e quella del 31, con tutte quelle in mezzo.
        Un periodo di un giorno solo e' legittimo — e' la notte di Capodanno.
        **Due periodi della stessa tipologia non possono sovrapporsi**: e' 409, e
        il messaggio dice con quale. Fra tipologie diverse invece coincidere e' il
        caso normale, perche' l'alta stagione e' la stessa per tutte le camere.
      required:
        - nome
        - dataInizio
        - dataFine
        - prezzoNotte
      properties:
        nome:
          type: string
          description: >
            Come lo chiama l'albergatore: "Alta stagione", "Ponte del 2 giugno".
            **Non e' una chiave e non e' unico**, nemmeno dentro la stessa
            tipologia: "Alta stagione" puo' legittimamente essere due periodi
            staccati dello stesso anno, e a distinguerli sono le date — che non
            possono accavallarsi.
          minLength: 1
          maxLength: 100
          example: Alta stagione
        dataInizio:
          type: string
          format: date
          description: Prima notte compresa nel periodo.
          example: 2027-07-01
        dataFine:
          type: string
          format: date
          description: >
            Ultima notte compresa nel periodo. Puo' coincidere con 'dataInizio'
            (una notte sola) ma non essere precedente: e' 400.
          example: 2027-08-31
        prezzoNotte:
          type: number
          description: >
            Prezzo base di una notte del periodo, in euro. I singoli giorni della
            settimana possono scavalcarlo con 'prezziGiorno'.
            Al massimo **due decimali**, come per il listino della tipologia e per
            la stessa ragione: la colonna e' NUMERIC(10,2) e un terzo decimale
            verrebbe troncato in silenzio.
          minimum: 0
          maximum: 99999999.99
          example: 180.00
        soggiornoMinimo:
          type: integer
          description: >
            Quante notti bisogna fermarsi come minimo per prenotare in questo
            periodo. **Uno vuol dire nessun vincolo**, ed e' il valore di default
            se il campo si omette: e' il caso normale fuori stagione. In alta
            stagione un albergo vende il ponte intero e non la singola notte, ed
            e' questo il numero che lo dice.
            **Quando un soggiorno attraversa piu' periodi vale il minimo del
            periodo in cui si arriva**, non il piu' severo fra quelli toccati: e'
            l'arrivo che si vende, e rifiutare per una regola del periodo in cui
            l'ospite entra a meta' vorrebbe dire non vendere nemmeno la parte
            libera.
          minimum: 1
          maximum: 90
          default: 1
          example: 3
        prezziGiorno:
          type: array
          description: >
            Prezzi che scavalcano 'prezzoNotte' per un giorno preciso della
            settimana. **Omesso o vuoto vuol dire che tutte le notti del periodo
            costano uguale**, ed e' il caso normale.
            Sulla PUT questo array **sostituisce** l'insieme intero, non ci si
            aggiunge: un giorno che non compare torna a costare il prezzo base.
            E' la stessa forma della PUT sulle dotazioni di una tipologia, e per
            la stessa ragione — cosi' l'operazione si puo' ripetere senza dover
            calcolare una differenza.
            Al massimo sette elementi, uno per giorno, e lo stesso giorno non puo'
            comparire due volte.
          maxItems: 7
          items:
            $ref: '#/components/schemas/PrezzoGiorno'
          example:
            - giorno: FRIDAY
              prezzo: 210.00
            - giorno: SATURDAY
              prezzo: 210.00

    PeriodoTariffarioResponse:
      type: object
      description: >
        Un periodo tariffario come viene restituito. Non contiene la tipologia a
        cui appartiene: sta gia' nell'URL con cui lo si e' chiesto, e ripeterla
        vorrebbe dire spedire ad ogni riga dell'elenco un oggetto che chi chiama
        ha gia' in mano.
      properties:
        id:
          type: integer
          format: int64
          example: 4
        nome:
          type: string
          example: Alta stagione
        dataInizio:
          type: string
          format: date
          example: 2027-07-01
        dataFine:
          type: string
          format: date
          description: Ultima notte compresa, non il giorno di partenza.
          example: 2027-08-31
        prezzoNotte:
          type: number
          description: Prezzo base di una notte del periodo, in euro.
          example: 180.00
        soggiornoMinimo:
          type: integer
          description: Notti minime per prenotare. Uno vuol dire nessun vincolo.
          example: 3
        prezziGiorno:
          type: array
          description: >
            I giorni che costano diversamente dal prezzo base, **da lunedi' a
            domenica**. Vuoto quando tutte le notti del periodo costano uguale.
            L'ordine e' quello della settimana e non quello in cui sono stati
            inseriti: lo mette il codice, perche' i nomi in ordine alfabetico —
            FRIDAY, MONDAY, SATURDAY... — non sono una settimana.
          items:
            $ref: '#/components/schemas/PrezzoGiorno'
          example:
            - giorno: FRIDAY
              prezzo: 210.00
            - giorno: SATURDAY
              prezzo: 210.00
