        tipologia inesistente (**400**), un numero di ospiti oltre la capienza
        della tipologia (**400**), un check-in gia' passato (**400**), un
        soggiorno **piu' lungo di 90 notti** (**400**), un soggiorno **piu' corto
        del minimo** che il periodo tariffario dell'arrivo impone (**400**, e il
        minimo lo si legge da 'soggiornoMinimo' in GET /api/disponibilita) e
        **nessuna camera libera** per quel periodo (**409**).
