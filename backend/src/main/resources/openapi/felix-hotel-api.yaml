  /api/prenotazioni:

    get:
      tags:
        - Prenotazioni
      operationId: elencaPrenotazioni
      summary: Elenco paginato delle prenotazioni
      description: >
        Restituisce le prenotazioni in ordine di data di check-in decrescente
        (gli arrivi piu' recenti per primi) e divise in pagine, con un filtro
        facoltativo sullo stato. A parita' di giorno di arrivo ordina per
        identificativo decrescente, cioe' dalla prenotazione aperta piu' di
        recente: serve a rendere la paginazione stabile, perche' molte
        prenotazioni cominciano lo stesso giorno e senza un secondo criterio la
        stessa riga potrebbe comparire in due pagine o in nessuna.
        **Cosa si vede dipende da chi chiede**, e non e' un dettaglio di
        comodita': un **USER** vede *solo le proprie*, **STAFF** e **ADMIN**
        vedono tutte. Non serve nessun parametro per dirlo — l'ambito lo decide
        il token, perche' un filtro che il client puo' scegliere e' un filtro
        che il client puo' non mandare.
        Risposta: busta ApiBaseResponsePaginated con un **array di
        PrenotazioneResponse** in 'data' e i metadati di pagina in 'page'.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaginaNumero'
        - $ref: '#/components/parameters/PaginaDimensione'
        - $ref: '#/components/parameters/FiltroStatoPrenotazione'
