      tags:
        - Ospiti
      operationId: elencaOspitiPrenotazione
      summary: Ospiti registrati su una prenotazione
      description: >
        Chi soggiorna davvero, con il documento di ognuno. Riservato a **STAFF**
        e **ADMIN**: e' un adempimento di legge che si fa al banco con i
        documenti in mano, non qualcosa che il cliente compili da solo — e il
        contenuto sono dati personali di terzi, non del titolare della
        prenotazione. Un cliente prende **403** anche sulla propria.
        **Non e' paginato**, come la galleria fotografica e per la stessa
        ragione: e' una lista di dimensione nota per costruzione. Il tetto qui
        non e' una costante ma 'numeroOspiti' della prenotazione, che a sua volta
        non puo' superare la capienza della tipologia.
        L'ordine e' quello di registrazione, dal primo inserito all'ultimo:
        nessuno dei dati di un ospite e' un criterio sensato per ordinare —
        alfabetico per cognome cambierebbe l'elenco a ogni aggiunta — e chi
        registra si aspetta di ritrovare la lista com'e' cresciuta sotto le sue
        mani.
        Risposta: busta ApiBaseResponse con un **array di OspiteResponse** in
        'data', vuoto se non e' stato ancora registrato nessuno.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPrenotazione'
      responses:
        '200':
          description: Ospiti della prenotazione ('data' = array di OspiteResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Ospiti della prenotazione recuperati
                timestamp: 2026-09-10T15:04:00Z
                data:
                  - id: 12
                    nome: Mario
                    cognome: Rossi
                    tipoDocumento: CARTA_IDENTITA
                    numeroDocumento: CA12345AB
                    dataNascita: 1985-04-17
                  - id: 13
                    nome: Anna
                    cognome: Rossi
                    tipoDocumento: PASSAPORTO
                    numeroDocumento: YA1234567
                    dataNascita: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Ospiti
      operationId: aggiungiOspitePrenotazione
      summary: Registra un ospite su una prenotazione
      description: >
        Registra una persona che soggiorna, col suo documento. Riservato a
        **STAFF** e **ADMIN**.
        **Perche' esiste**: il TULPS (l'articolo 109, quello della "schedina
        alloggiati") obbliga a registrare il documento di **ogni persona che
        dorme in albergo**, non del solo intestatario della prenotazione. Chi ha
        prenotato lo conosciamo gia' — e' l'account — ma di chi viaggia con lui
        non sapevamo niente, e i posti letto venduti li conta 'numeroOspiti'.
        **Quando si puo' fare**: su una prenotazione **CONFERMATA** o gia' in
        **CHECK_IN**, altrimenti **409**. Su IN_ATTESA no, perche' finche'
        nessuno ha confermato non c'e' nessun soggiorno di cui registrare gli
        ospiti; su ANNULLATA e CHECK_OUT no perche' vale la regola che il
        progetto applica a tutto cio' che e' concluso — *quello che c'e' gia'
        resta, di nuovo non si aggiunge niente*. Su un soggiorno finito e' anche
        la cosa giusta per un registro di legge: non lo si riscrive dopo.
        **409 se gli ospiti sono gia' 'numeroOspiti'**: non se ne registrano piu'
        di quanti posti letto sono stati venduti.
        **Chi arriva in soprannumero oggi non ha una strada breve**, e vale la
        pena saperlo invece di scoprirlo al banco: 'numeroOspiti' si fissa alla
        creazione e nessun endpoint lo cambia, quindi l'unica via e' annullare e
        riprenotare — perdendo l'importo gia' calcolato, che e' una fotografia
        presa in quel momento. E' un limite noto, non una dimenticanza.
        **409 se lo stesso documento e' gia' registrato su questa prenotazione**:
        la stessa persona due volte non e' un ospite in piu', ed e' un errore che
        conta doppio — farebbe raggiungere 'numeroOspiti' lasciando fuori
        qualcuno che dorme li' davvero. Due minorenni registrati **senza**
        documento non fanno scattare questo 409, ed e' corretto: dove non c'e' un
        documento non c'e' niente da confrontare.
        **I minorenni si registrano senza documento**: 'tipoDocumento' e
        'numeroDocumento' sono obbligatori solo per chi e' maggiorenne il giorno
        dell'arrivo, altrimenti e' **400**. La data che decide e' 'dataCheckIn'
        della prenotazione, perche' e' all'atto dell'arrivo che il TULPS vuole il
        documento. **L'obbligo di legge non si allenta**: un minorenne un
        documento proprio non ce l'ha, e farglielo inventare al banco riempirebbe
        il registro di numeri falsi.
        Risposta: busta ApiBaseResponse con **OspiteResponse** in 'data'.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPrenotazione'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OspiteRequest'
      responses:
        '201':
          description: Ospite registrato ('data' = OspiteResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 201
                message: Ospite registrato
                timestamp: 2026-09-10T15:04:00Z
                data:
                  id: 12
                  nome: Mario
                  cognome: Rossi
                  tipoDocumento: CARTA_IDENTITA
                  numeroDocumento: CA12345AB
                  dataNascita: 1985-04-17
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/prenotazioni/{id}/ospiti/{ospiteId}:

    put:
      tags:
        - Ospiti
      operationId: aggiornaOspitePrenotazione
      summary: Corregge i dati di un ospite registrato
      description: >
        Riscrive i dati di un ospite gia' registrato. Riservato a **STAFF** e
        **ADMIN**.
        **Serve a correggere, non a sostituire una persona con un'altra**, ed e'
        la ragione per cui questa rotta esiste invece di far cancellare e
        riscrivere: un numero di documento digitato storto ci si accorge quasi
        sempre subito, e obbligare a un DELETE seguito da un POST vorrebbe dire
        che la correzione passa per un istante in cui l'ospite non e' registrato.
        Su una prenotazione gia' in CHECK_IN quell'istante e' uno stato che il
        registro non dovrebbe mai attraversare.
        **Vale la stessa finestra della POST**: CONFERMATA o CHECK_IN, altrimenti
        **409**. E lo stesso **409** sul documento gia' presente su un *altro*
        ospite della stessa prenotazione — il proprio non conta, altrimenti
        correggere il solo nome sarebbe impossibile.
        **Vale anche la stessa regola sui minorenni**: il documento e' obbligatorio
        solo per chi e' maggiorenne alla data di arrivo, altrimenti **400**.
        E' una PUT: un campo facoltativo omesso viene **azzerato**, non lasciato
        com'era — quindi correggere un ospite maggiorenne dimenticandosi il
        documento non lo lascia com'era, lo rifiuta.
        Risposta: busta ApiBaseResponse con **OspiteResponse** in 'data'.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPrenotazione'
        - $ref: '#/components/parameters/IdOspite'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OspiteRequest'
      responses:
        '200':
          description: Ospite aggiornato ('data' = OspiteResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Ospite aggiornato
                timestamp: 2026-09-10T15:04:00Z
                data:
                  id: 12
                  nome: Mario
                  cognome: Rossi
                  tipoDocumento: CARTA_IDENTITA
                  numeroDocumento: CA98765ZY
                  dataNascita: 1985-04-17
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Ospiti
      operationId: eliminaOspitePrenotazione
      summary: Toglie un ospite da una prenotazione
      description: >
        Cancella la registrazione di un ospite. Riservato a **STAFF** e
        **ADMIN**.
        L'ospite si indirizza **dentro la sua prenotazione** e non da una rotta
        propria: cosi' un ospite che esiste ma appartiene a un'altra prenotazione
        da' **404** come se non ci fosse, invece di essere cancellato a chi ha
        sbagliato URL. E' la stessa scelta gia' fatta per le foto di una
        tipologia.
        **Vale la stessa finestra della POST**: CONFERMATA o CHECK_IN, altrimenti
        **409**. Su una prenotazione in CHECK_IN togliere un ospite e' legittimo
        — qualcuno che doveva venire non e' venuto — ma va saputo che riporta il
        conto sotto 'numeroOspiti', e da quel momento la prenotazione non
        soddisfa piu' la condizione che il check-in pretende. Non c'e' niente da
        rifare, il check-in e' gia' avvenuto: conta per chi legge il registro
        dopo.
        Risposta: busta ApiBaseResponse con 'data' null.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPrenotazione'
        - $ref: '#/components/parameters/IdOspite'
      responses:
        '200':
          description: Ospite eliminato ('data' = null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Ospite eliminato
                timestamp: 2026-09-10T15:04:00Z
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disponibilita:

    get:
      tags:
        - Disponibilita
      operationId: cercaDisponibilita
      summary: Cerca le tipologie prenotabili in un periodo
      description: >
        E' la ricerca del cliente: date di arrivo e partenza, e in risposta le
        tipologie con **quante camere restano** in quel periodo e **quanto
        costerebbe** il soggiorno.
        **Pubblico**, come il catalogo: e' la domanda che un visitatore fa prima
        di registrarsi, e obbligarlo a un account per sapere se c'e' posto e' il
        modo di non ricevere prenotazioni.
        **Restituisce anche le tipologie esaurite**, con `camereDisponibili` a
        zero, e non e' una svista: sapere che la Suite esiste ed e' finita e'
        un'informazione diversa dal non vederla affatto — e togliere le righe
        dopo aver impaginato farebbe pagine di dimensione variabile, cioe' il
        difetto che questo progetto ha gia' evitato altrove.
        La disponibilita' e' calcolata sulla **notte peggiore** del periodo, non
        sul numero di prenotazioni che lo toccano: chi prenota vuole una stanza
        per tutte le notti che ha chiesto. Tre soggiorni brevi messi in fila
        occupano una camera sola.
        **Il prezzo lo decidono i periodi tariffari**, dal 2026-09-01:
        'importoTotale' e' la somma delle notti una per una, e due notti dello
        stesso soggiorno possono costare diversamente — periodi diversi, o giorni
        della settimana diversi. E' anche il motivo per cui i filtri
        'prezzoMinimo' e 'prezzoMassimo' guardano il prezzo **medio delle notti
        cercate** e non il listino della tipologia.
        **'soggiornoMinimo' dice quante notti quella tipologia pretende** con
        quell'arrivo. Le righe che non lo rispettano **non vengono tolte**, come
        non vengono tolte le esaurite: la creazione le rifiuterebbe con un 400, e
        vederle con il loro minimo scritto accanto e' cio' che permette a chi
        cerca di allungare di una notte invece di credere che non ci sia posto.
        **Un periodo piu' lungo di 90 notti e' 400**, come per la creazione e con
        lo stesso numero: cosi' i due endpoint non dicono cose diverse sulla
        stessa richiesta, che e' esattamente cio' che succedeva prima che il tetto
        esistesse.
        Risposta: busta ApiBaseResponsePaginated con un **array di
        DisponibilitaTipologia** in 'data' e i metadati di pagina in 'page'.
      parameters:
        - $ref: '#/components/parameters/DataCheckInRicerca'
        - $ref: '#/components/parameters/DataCheckOutRicerca'
        - $ref: '#/components/parameters/FiltroNumeroOspiti'
        - $ref: '#/components/parameters/FiltroPrezzoMinimo'
        - $ref: '#/components/parameters/FiltroPrezzoMassimo'
        - $ref: '#/components/parameters/PaginaNumero'
        - $ref: '#/components/parameters/PaginaDimensione'
      responses:
        '200':
          description: Pagina di tipologie con la loro disponibilita' ('data' = array di DisponibilitaTipologia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponsePaginated'
              example:
                status: 200
                message: Disponibilita' calcolata
                timestamp: 2026-08-27T10:15:30Z
                data:
                  - tipologia:
                      id: 1
                      nome: Doppia Superior
                      descrizione: Camera doppia con vista sul giardino
                      capienzaMax: 2
                      prezzoNotte: 120.00
                      dotazioni:
                        - id: 1
                          nome: Wi-Fi
                          descrizione: Connessione senza fili gratuita in tutta la struttura
                    camereDisponibili: 3
                    importoTotale: 360.00
                page:
                  pageNumber: 0
                  pageSize: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'


