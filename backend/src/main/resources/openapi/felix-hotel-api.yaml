openapi: 3.0.3
info:
  title: Felix Hotel API
  description: >
    Contratto OpenAPI da cui vengono generati (a build-time, via
    openapi-generator-maven-plugin) sia i DTO di richiesta/risposta sia le
    interfacce API dei Controller: questo file e' la fonte di verita' per
    la FORMA dei DTO ("components/schemas") e per le rotte ("paths"). I
    Controller implementano le interfacce generate, valorizzando solo il
    corpo dei metodi (pattern Controller -> Service invariato).
  version: 0.1.0
paths:

  /api/auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Registrazione nuovo cliente
      description: >
        Crea un nuovo account cliente (ruolo USER). Nessuna autorizzazione
        richiesta. **Non restituisce un token**: dopo la registrazione il
        client deve chiamare /api/auth/login. Scelta deliberata — il 201
        restituisce la risorsa creata, non una sessione: creare l'account e
        autenticarsi sono due operazioni distinte.
        Le registrazioni sono soggette a un **ritardo progressivo per
        indirizzo IP** (vedi la risposta 429): superate le prime, fra una
        registrazione e la successiva va rispettata un'attesa che raddoppia
        ogni volta. A differenza del login qui si contano **tutti** i
        tentativi e non solo quelli falliti: e' proprio la creazione di
        account a macchina che si vuole impedire.
        Risposta: busta ApiBaseResponse con **AccountSummary** in 'data'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account creato ('data' = AccountSummary, nessun token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 201
                message: Registrazione completata con successo
                timestamp: 2026-08-05T10:15:30Z
                data:
                  id: 1
                  nome: Mario
                  cognome: Rossi
                  email: mario.rossi@example.com
                  ruolo: USER
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Login cliente o staff
      description: >
        Autentica un account (cliente o personale) via email/password e
        restituisce **solo** il token JWT: i dati dell'account si
        recuperano a parte, da /api/auth/me. Nessuna autorizzazione
        richiesta.
        I tentativi falliti sono soggetti a un **ritardo progressivo**
        (vedi la risposta 429): superati i primi, fra un tentativo e il
        successivo va rispettata un'attesa che raddoppia ogni volta. Un
        client che riprova in automatico deve leggere il 429 e aspettare,
        non insistere.
        Risposta: busta ApiBaseResponse con **AuthResponse** in 'data'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login riuscito, token JWT emesso ('data' = AuthResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Login effettuato con successo
                timestamp: 2026-08-05T10:15:30Z
                data:
                  token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJtYXJpby5yb3NzaUBleGFtcGxlLmNvbSJ9
                  tokenType: Bearer
                  expiresInMs: 3600000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/me:
    get:
      tags:
        - Auth
      operationId: me
      summary: Dati dell'account autenticato
      description: >
        Restituisce il riepilogo dell'account a cui appartiene il token
        usato per la chiamata. Non prende nessun parametro: l'utente e'
        quello del token, non uno scelto da chi chiama.
        Richiede autenticazione (qualsiasi ruolo).
        Risposta: busta ApiBaseResponse con **AccountSummary** in 'data'.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dati dell'account autenticato ('data' = AccountSummary)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Dati account recuperati
                timestamp: 2026-08-05T10:15:30Z
                data:
                  id: 1
                  nome: Mario
                  cognome: Rossi
                  email: mario.rossi@example.com
                  ruolo: USER
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tipologie-camera:

    get:
      tags:
        - TipologieCamera
      operationId: elencaTipologieCamera
      summary: Elenco paginato delle tipologie di camera
      description: >
        Restituisce le tipologie di camera offerte dalla struttura, in ordine
        alfabetico di nome e divise in pagine. **Pubblico**: e' il catalogo
        che il frontoffice mostra a chi visita il sito senza essersi
        registrato, quindi non richiede autenticazione.
        Risposta: busta ApiBaseResponsePaginated con un **array di
        TipologiaCameraResponse** in 'data' e i metadati di pagina in 'page'.
      parameters:
        - $ref: '#/components/parameters/PaginaNumero'
        - $ref: '#/components/parameters/PaginaDimensione'
      responses:
        '200':
          description: Pagina di tipologie ('data' = array di TipologiaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponsePaginated'
              example:
                status: 200
                message: Tipologie di camera recuperate
                timestamp: 2026-08-06T10:15:30Z
                data:
                  - id: 1
                    nome: Doppia Superior
                    descrizione: Camera doppia con vista sul giardino
                    capienzaMax: 2
                    prezzoNotte: 120.00
                    dotazioni:
                      - id: 1
                        nome: Wi-Fi
                        descrizione: Connessione senza fili gratuita in tutta la struttura
                page:
                  pageNumber: 0
                  pageSize: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - TipologieCamera
      operationId: creaTipologiaCamera
      summary: Crea una tipologia di camera
      description: >
        Aggiunge una tipologia al catalogo. Riservato agli **ADMIN**: e' il
        listino della struttura, non qualcosa che un cliente possa toccare.
        Il nome deve essere libero — il confronto ignora le maiuscole, quindi
        "Doppia" e "doppia" sono lo stesso nome e la seconda riceve 409.
        Risposta: busta ApiBaseResponse con **TipologiaCameraResponse** in 'data'.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipologiaCameraRequest'
      responses:
        '201':
          description: Tipologia creata ('data' = TipologiaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 201
                message: Tipologia di camera creata
                timestamp: 2026-08-06T10:15:30Z
                data:
                  id: 1
                  nome: Doppia Superior
                  descrizione: Camera doppia con vista sul giardino
                  capienzaMax: 2
                  prezzoNotte: 120.00
                  dotazioni:
                    - id: 1
                      nome: Wi-Fi
                      descrizione: Connessione senza fili gratuita in tutta la struttura
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tipologie-camera/{id}:

    get:
      tags:
        - TipologieCamera
      operationId: dettaglioTipologiaCamera
      summary: Dettaglio di una tipologia di camera
      description: >
        Restituisce una singola tipologia. **Pubblico** per lo stesso motivo
        dell'elenco: e' la scheda che il cliente apre dal catalogo.
        Risposta: busta ApiBaseResponse con **TipologiaCameraResponse** in 'data'.
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      responses:
        '200':
          description: Tipologia trovata ('data' = TipologiaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Tipologia di camera recuperata
                timestamp: 2026-08-06T10:15:30Z
                data:
                  id: 1
                  nome: Doppia Superior
                  descrizione: Camera doppia con vista sul giardino
                  capienzaMax: 2
                  prezzoNotte: 120.00
                  dotazioni:
                    - id: 1
                      nome: Wi-Fi
                      descrizione: Connessione senza fili gratuita in tutta la struttura
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - TipologieCamera
      operationId: aggiornaTipologiaCamera
      summary: Aggiorna una tipologia di camera
      description: >
        Sostituisce **tutti** i campi modificabili della tipologia: e' una PUT,
        non una PATCH, quindi un campo omesso viene azzerato e non lasciato
        com'era. Riservato agli **ADMIN**.
        **Le dotazioni non fanno parte di questo schema e non vengono
        toccate**: hanno un endpoint proprio
        (PUT /api/tipologie-camera/{id}/dotazioni). Non e' un'eccezione alla
        semantica della PUT — sono una risorsa a se', non un campo di questa.
        Risposta: busta ApiBaseResponse con **TipologiaCameraResponse** in 'data'.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipologiaCameraRequest'
      responses:
        '200':
          description: Tipologia aggiornata ('data' = TipologiaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Tipologia di camera aggiornata
                timestamp: 2026-08-06T10:15:30Z
                data:
                  id: 1
                  nome: Doppia Superior
                  descrizione: Camera doppia con vista sul mare
                  capienzaMax: 2
                  prezzoNotte: 145.00
                  dotazioni:
                    - id: 1
                      nome: Wi-Fi
                      descrizione: Connessione senza fili gratuita in tutta la struttura
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - TipologieCamera
      operationId: eliminaTipologiaCamera
      summary: Elimina una tipologia di camera
      description: >
        Rimuove la tipologia dal catalogo. Riservato agli **ADMIN**.
        Fallisce con **409** se ci sono camere o prenotazioni che la
        referenziano: il vincolo lo impone il database e cancellare quei dati
        a cascata perderebbe lo storico delle prenotazioni. Per togliere dal
        listino una tipologia gia' usata va prima svuotata dei suoi
        riferimenti.
        Risposta: busta ApiBaseResponse con 'data' null — non c'e' piu' niente
        da restituire. Si usa 200 e non 204 perche' la busta standard vale per
        ogni endpoint del progetto e un 204 non puo' avere corpo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      responses:
        '200':
          description: Tipologia eliminata ('data' = null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Tipologia di camera eliminata
                timestamp: 2026-08-06T10:15:30Z
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tipologie-camera/{id}/dotazioni:

    put:
      tags:
        - TipologieCamera
      operationId: impostaDotazioniTipologiaCamera
      summary: Imposta le dotazioni di una tipologia di camera
      description: >
        Sostituisce **l'intero insieme** delle dotazioni assegnate alla
        tipologia con quello ricevuto: quelle elencate restano o vengono
        aggiunte, quelle assenti vengono staccate. Un array vuoto le toglie
        tutte. Riservato agli **ADMIN**.
        E' una PUT e non due rotte di aggiunta/rimozione perche' l'operazione
        vera del backoffice e' "questa camera offre esattamente questo": una
        sola chiamata, idempotente, che non lascia stati intermedi se il
        client la ripete.
        Se uno degli id non corrisponde a nessuna dotazione la risposta e'
        **400** e non 404: il 404 di questo endpoint significa "questa
        tipologia non esiste", e usarlo anche per gli id nel corpo
        renderebbe le due cose indistinguibili proprio quando servono due
        rimedi diversi.
        Risposta: busta ApiBaseResponse con **TipologiaCameraResponse** in
        'data', gia' aggiornata con le dotazioni appena impostate.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipologiaCameraDotazioniRequest'
      responses:
        '200':
          description: Dotazioni impostate ('data' = TipologiaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Dotazioni della tipologia aggiornate
                timestamp: 2026-08-25T10:15:30Z
                data:
                  id: 1
                  nome: Doppia Superior
                  descrizione: Camera doppia con vista sul giardino
                  capienzaMax: 2
                  prezzoNotte: 120.00
                  dotazioni:
                    - id: 2
                      nome: Aria condizionata
                      descrizione: Climatizzatore con regolazione indipendente
                    - id: 1
                      nome: Wi-Fi
                      descrizione: Connessione senza fili gratuita in tutta la struttura
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tipologie-camera/{id}/media:

    get:
      tags:
        - MediaCamera
      operationId: elencaMediaTipologiaCamera
      summary: Foto di una tipologia di camera
      description: >
        Restituisce le foto della tipologia **nell'ordine in cui vanno
        mostrate**, dalla copertina all'ultima. E' pubblico come il resto del
        catalogo: sono le immagini che il sito mostra a chi sta scegliendo dove
        dormire, e tenerle dietro a un login vorrebbe dire un catalogo senza
        fotografie.
        **Non e' paginato**, unico elenco del progetto a non esserlo: una
        galleria si legge tutta insieme per costruire un carosello, e spezzarla
        in pagine costringerebbe il client a ricomporre da solo proprio la cosa
        per cui questo endpoint esiste — l'ordine. Non e' pero' una lista senza
        tetto: il limite lo mette la POST, che rifiuta la foto oltre la
        trentesima.
        La posizione **non e' un campo della risposta**: l'ordine e' quello
        dell'array e basta (vedi MediaCameraResponse per il perche').
        Risposta: busta ApiBaseResponse con un **array di MediaCameraResponse**
        in 'data', vuoto se la tipologia non ha ancora foto.
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      responses:
        '200':
          description: Foto della tipologia ('data' = array di MediaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Foto della tipologia recuperate
                timestamp: 2026-08-25T10:15:30Z
                data:
                  - id: 7
                    url: https://cdn.felixhotel.example/camere/doppia-superior/vista.jpg
                  - id: 3
                    url: https://cdn.felixhotel.example/camere/doppia-superior/bagno.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - MediaCamera
      operationId: aggiungiMediaTipologiaCamera
      summary: Aggiunge una foto a una tipologia di camera
      description: >
        Registra una foto per la tipologia e la mette **in fondo alla
        galleria**: la posizione non si sceglie qui, si sistema dopo con
        PUT /api/tipologie-camera/{id}/media/ordine. Riservato agli **ADMIN**.
        **Non e' un upload.** Il corpo porta un indirizzo, non un file: le
        immagini stanno altrove — un CDN, uno spazio oggetti — e questa API ne
        tiene l'elenco e l'ordine. Un endpoint che riceva byte e' un'altra cosa,
        e non esiste ancora.
        Risponde **409** in due casi, tutti e due conflitti con lo stato attuale
        della galleria: la stessa 'url' c'e' gia' in questa tipologia, oppure le
        foto sono gia' trenta.
        Risposta: busta ApiBaseResponse con **MediaCameraResponse** in 'data'.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCameraRequest'
      responses:
        '201':
          description: Foto aggiunta ('data' = MediaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 201
                message: Foto aggiunta alla tipologia
                timestamp: 2026-08-25T10:15:30Z
                data:
                  id: 7
                  url: https://cdn.felixhotel.example/camere/doppia-superior/vista.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tipologie-camera/{id}/media/ordine:

    put:
      tags:
        - MediaCamera
      operationId: riordinaMediaTipologiaCamera
      summary: Riordina le foto di una tipologia di camera
      description: >
        Ridefinisce **l'intera sequenza** delle foto: l'array ricevuto e' la
        galleria nell'ordine in cui andra' mostrata, dal primo elemento in poi.
        Riservato agli **ADMIN**.
        E' una PUT sola con tutta la lista e non due rotte "sposta su" / "sposta
        giu'", per la stessa ragione per cui le dotazioni si impostano in blocco:
        chi trascina una foto dalla sesta alla prima posizione sa gia' com'e'
        fatta la lista alla fine, e farglielo dire in cinque chiamate vuol dire
        cinque occasioni di fermarsi a meta' lasciando un ordine che non ha
        voluto nessuno. Cosi' invece l'operazione e' una, ed e' idempotente:
        ripeterla non cambia niente.
        **L'elenco deve coincidere esattamente** con le foto che la tipologia ha
        adesso: stessi id, tutti, una volta sola. Un id di troppo, uno mancante o
        uno ripetuto sono **400** e non vengono ignorati in silenzio — se
        qualcuno ha aggiunto o tolto una foto mentre l'ordine veniva deciso, la
        richiesta che arriva dopo descrive una galleria che non esiste piu', e
        applicarla per la parte che combacia lascerebbe le altre in un ordine che
        non ha scelto nessuno. Meglio un errore che il client puo' rimediare
        rileggendo la lista.
        Un array vuoto e' legittimo solo se la tipologia non ha foto: e' il caso
        limite della stessa regola, non un'eccezione ad essa.
        Risposta: busta ApiBaseResponse con l'**array di MediaCameraResponse**
        in 'data', gia' nel nuovo ordine.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCameraOrdineRequest'
      responses:
        '200':
          description: Galleria riordinata ('data' = array di MediaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Ordine delle foto aggiornato
                timestamp: 2026-08-25T10:15:30Z
                data:
                  - id: 3
                    url: https://cdn.felixhotel.example/camere/doppia-superior/bagno.jpg
                  - id: 7
                    url: https://cdn.felixhotel.example/camere/doppia-superior/vista.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tipologie-camera/{id}/media/{mediaId}:

    delete:
      tags:
        - MediaCamera
      operationId: eliminaMediaTipologiaCamera
      summary: Elimina una foto da una tipologia di camera
      description: >
        Toglie la foto dalla galleria. Riservato agli **ADMIN**.
        La foto si indirizza **dentro la sua tipologia** e non da una rotta
        propria: cosi' una foto che esiste ma appartiene a un'altra tipologia da'
        **404** come se non ci fosse, invece di essere cancellata a chi ha
        sbagliato URL.
        Le foto rimaste **non vengono rinumerate** e il loro ordine relativo non
        cambia. Non e' un'omissione: e' esattamente il motivo per cui la
        posizione non compare nella risposta (vedi MediaCameraResponse) — se
        fosse un campo osservabile, un buco fra due numeri diventerebbe qualcosa
        da spiegare al client.
        Risposta: busta ApiBaseResponse con 'data' null.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
        - $ref: '#/components/parameters/IdMediaCamera'
      responses:
        '200':
          description: Foto eliminata ('data' = null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Foto eliminata
                timestamp: 2026-08-25T10:15:30Z
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tipologie-camera/{id}/tariffe:

    get:
      tags:
        - Tariffe
      operationId: elencaTariffeTipologiaCamera
      summary: Periodi tariffari di una tipologia di camera
      description: >
        Il calendario dei prezzi di una tipologia: in che date costa quanto, e
        quante notti bisogna fermarsi come minimo. Riservato a **STAFF** e
        **ADMIN**.
        **Perche' lo STAFF legge e non scrive**: chi sta al banco deve poter dire
        al telefono quanto costa una settimana di agosto, ed e' il lavoro di ogni
        turno — la stessa ragione per cui lo STAFF legge l'inventario delle
        camere. Decidere i prezzi no: quella e' una scelta commerciale, e resta
        agli ADMIN come la pubblicazione delle foto.
        **Non e' pubblico**, al contrario del catalogo: il cliente la domanda sui
        prezzi la fa a GET /api/disponibilita, che gli risponde per le date che
        gli interessano. Il listino intero e' un documento commerciale, e non c'e'
        nessuna ragione di stamparlo in vetrina.
        **E' paginato**, al contrario della galleria e del registro ospiti: quelli
        sono elenchi di dimensione nota per costruzione, i periodi invece si
        accumulano di anno in anno e niente li limita.
        L'ordine e' **per data di inizio**, dal piu' vecchio al piu' recente: e'
        un calendario, e chi lo guarda vuole vedere l'anno scorrere. Le date non
        possono accavallarsi, quindi questo ordine non ha bisogno di un secondo
        criterio.
        **Le notti che nessun periodo copre non compaiono qui e non sono un
        buco**: costano il 'prezzoNotte' di listino della tipologia. Un albergo
        senza nessun periodo configurato vende comunque, a quel prezzo.
        Risposta: busta ApiBaseResponsePaginated con un **array di
        PeriodoTariffarioResponse** in 'data' e i metadati di pagina in 'page'.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
        - $ref: '#/components/parameters/PaginaNumero'
        - $ref: '#/components/parameters/PaginaDimensione'
      responses:
        '200':
          description: Pagina di periodi tariffari ('data' = array di PeriodoTariffarioResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponsePaginated'
              example:
                status: 200
                message: Periodi tariffari recuperati
                timestamp: 2026-09-01T10:15:30Z
                data:
                  - id: 4
                    nome: Alta stagione
                    dataInizio: 2027-07-01
                    dataFine: 2027-08-31
                    prezzoNotte: 180.00
                    soggiornoMinimo: 3
                    prezziGiorno:
                      - giorno: FRIDAY
                        prezzo: 210.00
                      - giorno: SATURDAY
                        prezzo: 210.00
                page:
                  pageNumber: 0
                  pageSize: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Tariffe
      operationId: creaTariffaTipologiaCamera
      summary: Aggiunge un periodo tariffario a una tipologia
      description: >
        Dichiara che in un certo intervallo di date questa tipologia costa un
        certo prezzo. Riservato agli **ADMIN**.
        **Gli estremi sono compresi tutti e due, e si contano in notti**: un
        periodo dal 1 al 31 agosto e' la notte del 1 agosto e quella del 31, con
        tutte quelle in mezzo. Un periodo di un giorno solo — 'dataInizio' uguale
        a 'dataFine' — e' legittimo: e' la singola notte di Capodanno.
        **409 se si sovrappone a un altro periodo della stessa tipologia**, e il
        messaggio dice con quale. E' la regola che tiene in piedi tutto il resto:
        *un giorno, un prezzo*. Senza, "quanto costa il 15 agosto" avrebbe due
        risposte e nessun criterio per sceglierne una. Periodi di **tipologie
        diverse** possono naturalmente coincidere — anzi, e' il caso normale:
        l'alta stagione e' la stessa per tutte le camere.
        **'prezziGiorno' sono scavalcamenti, non un listino**: si scrivono solo i
        giorni che costano diversamente dal 'prezzoNotte' del periodo, e l'array
        vuoto e' il caso normale. Non c'e' nessun obbligo di riempirli tutti e
        sette.
        **Il prezzo di un giorno sostituisce quello base, non ci si somma**:
        scrivere 30 su SATURDAY vuol dire che il sabato costa trenta euro, non
        trenta euro in piu'.
        **Non tocca le prenotazioni gia' fatte**: il loro 'importoTotale' e' una
        fotografia presa alla creazione, e cambiare il listino non riscrive la
        storia di chi ha gia' comprato.
        Risposta: busta ApiBaseResponse con **PeriodoTariffarioResponse** in
        'data'.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodoTariffarioRequest'
      responses:
