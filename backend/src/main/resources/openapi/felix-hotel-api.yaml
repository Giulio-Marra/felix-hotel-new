  /api/prenotazioni/{id}/check-out:

    put:
      tags:
        - Prenotazioni
      operationId: checkOutPrenotazione
      summary: Registra la partenza dell'ospite (CHECK_IN -> CHECK_OUT)
      description: >
        L'ospite e' partito. Da **CHECK_IN** a **CHECK_OUT**. Da qualunque altro
        stato e' **409**: non si fa uscire chi non e' mai entrato.
        **La camera assegnata resta scritta sulla prenotazione**, perche' e' un
        fatto accaduto — in quella stanza ci ha dormito qualcuno, e a distanza
        di mesi puo' servire saperlo.
        **Effetto sulla camera**: torna **LIBERA**, ma solo se era OCCUPATA. Se
        nel frattempo qualcuno l'ha segnata MANUTENZIONE — un guasto scoperto
        durante il soggiorno — quello stato **resta**: la partenza dell'ospite
        non e' una buona ragione per rimettere in servizio una stanza rotta.
        **La prenotazione continua a occupare il suo periodo** anche da
        CHECK_OUT, ed e' voluto: e' storia, non disponibilita' futura. Quel
        periodo e' passato, quindi non toglie niente a nessuno.
        Non ha corpo. Solo **STAFF** e **ADMIN**.
        Risposta: busta ApiBaseResponse con **PrenotazioneResponse** in 'data'.
      security:
