              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 201
                message: Prenotazione creata
                timestamp: 2026-08-26T10:15:30Z
                data:
                  id: 1
                  dataCheckIn: 2026-09-10
                  dataCheckOut: 2026-09-13
                  numeroOspiti: 2
                  stato: IN_ATTESA
                  canale: ONLINE
                  importoTotale: 360.00
                  note: Arrivo in tarda serata
                  utente:
                    id: 7
                    nome: Mario
                    cognome: Rossi
                    email: mario.rossi@example.com
                  tipologia:
                    id: 1
                    nome: Doppia Superior
                  gestitaDa: null
                  motivoCancellazione: null
                  dataCancellazione: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

