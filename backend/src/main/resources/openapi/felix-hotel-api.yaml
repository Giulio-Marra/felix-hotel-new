      operationId: aggiornaTariffaTipologiaCamera
      summary: Modifica un periodo tariffario
      description: >
        Riscrive il periodo per intero — date, prezzo, soggiorno minimo e prezzi
        per giorno della settimana. Riservato agli **ADMIN**.
        **'prezziGiorno' viene sostituito e non integrato**, come gia' fa la PUT
        delle dotazioni su una tipologia: l'array che si manda diventa l'insieme
        completo, e un giorno che non c'e' torna a costare il prezzo base del
        periodo. Ometterlo o mandarlo vuoto li toglie tutti. E' la forma che
        rende l'operazione ripetibile: si manda com'e' adesso e com'e' dopo, non
        una differenza da calcolare.
        **409 se le date nuove si sovrappongono a un altro periodo** della stessa
        tipologia. Riconfermare al periodo le proprie date non e' una
        sovrapposizione: se stesso non si conta.
        **Il periodo si indirizza dentro la sua tipologia** e non da una rotta
        propria: un periodo che esiste ma appartiene a un'altra tipologia da'
        **404** come se non ci fosse, invece di essere modificato a chi ha
        sbagliato URL. Stessa scelta gia' fatta per le foto.
        **Non tocca le prenotazioni gia' fatte**, per la stessa ragione della
        POST: l'importo e' una fotografia.
        Risposta: busta ApiBaseResponse con **PeriodoTariffarioResponse** in
        'data'.
