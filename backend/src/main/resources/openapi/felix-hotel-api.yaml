                $ref: '#/components/schemas/ApiBaseResponsePaginated'
              example:
                status: 200
                message: Prenotazioni recuperate
                timestamp: 2026-08-26T10:15:30Z
                data:
                  - id: 1
                    dataCheckIn: 2026-09-10
                    dataCheckOut: 2026-09-13
                    numeroOspiti: 2
                    stato: CONFERMATA
                    canale: ONLINE
                    importoTotale: 360.00
                    note: Arrivo in tarda serata
                    utente:
                      id: 7
                      nome: Mario
                      cognome: Rossi
                      email: mario.rossi@example.com
                    tipologia:
                      id: 1
                      nome: Doppia Superior
                    gestitaDa: null
                    motivoCancellazione: null
                    dataCancellazione: null
                page:
                  pageNumber: 0
                  pageSize: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Prenotazioni
      operationId: creaPrenotazione
      summary: Crea una prenotazione (stato IN_ATTESA)
      description: >
        Apre una prenotazione nello stato **IN_ATTESA**, che e' il carrello: un
        appunto personale che **non blocca la disponibilita' per nessun altro**.
        A riservare davvero e' la conferma (PUT /api/prenotazioni/{id}/conferma).
        **Due modi di chiamarlo, decisi dal ruolo di chi chiama.**
        Un **USER** prenota per se': `utenteId` e `canale` vanno **omessi** —
        mandarli e' un 400, non un valore ignorato in silenzio — e la
        prenotazione nasce con canale ONLINE, intestata a chi ha il token.
        **STAFF** e **ADMIN** prenotano per un cliente al banco o al telefono:
        li' `utenteId` e `canale` diventano **obbligatori**, e la prenotazione
        registra chi del personale l'ha presa.
        Si prenota una **tipologia**, non una stanza: quale camera fisica
        tocchera' si decide al check-in.
        Cosa fa fallire la richiesta, oltre ai vincoli dello schema: una
        tipologia inesistente (**400**), un numero di ospiti oltre la capienza
        della tipologia (**400**), un check-in gia' passato (**400**) e
        **nessuna camera libera** per quel periodo (**409**).
        Risposta: busta ApiBaseResponse con **PrenotazioneResponse** in 'data'.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrenotazioneRequest'
      responses:
