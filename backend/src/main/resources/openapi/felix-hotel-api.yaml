                data:
                  id: 4
                  nome: Alta stagione
                  dataInizio: 2027-07-01
                  dataFine: 2027-08-31
                  prezzoNotte: 180.00
                  soggiornoMinimo: 3
                  prezziGiorno:
                    - giorno: FRIDAY
                      prezzo: 210.00
                    - giorno: SATURDAY
                      prezzo: 210.00
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
