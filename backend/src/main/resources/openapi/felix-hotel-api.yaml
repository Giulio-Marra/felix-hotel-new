        **Cambiare il ruolo e' permesso**, anche a se stessi, con un limite:
        l'operazione che lascerebbe l'albergo senza nessun ADMIN attivo viene
        rifiutata con **409**. Chiudersi fuori dal backoffice si ripara solo
