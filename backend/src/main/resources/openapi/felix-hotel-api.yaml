openapi: 3.0.3
info:
  title: Felix Hotel API
  description: >
    Contratto OpenAPI da cui vengono generati (a build-time, via
    openapi-generator-maven-plugin) sia i DTO di richiesta/risposta sia le
    interfacce API dei Controller: questo file e' la fonte di verita' per
    la FORMA dei DTO ("components/schemas") e per le rotte ("paths"). I
    Controller implementano le interfacce generate, valorizzando solo il
    corpo dei metodi (pattern Controller -> Service invariato).
  version: 0.1.0
paths:

  /api/auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Registrazione nuovo cliente
      description: >
        Crea un nuovo account cliente (ruolo USER). Nessuna autorizzazione
        richiesta. **Non restituisce un token**: dopo la registrazione il
        client deve chiamare /api/auth/login. Scelta deliberata — il 201
        restituisce la risorsa creata, non una sessione: creare l'account e
        autenticarsi sono due operazioni distinte.
        Le registrazioni sono soggette a un **ritardo progressivo per
        indirizzo IP** (vedi la risposta 429): superate le prime, fra una
        registrazione e la successiva va rispettata un'attesa che raddoppia
        ogni volta. A differenza del login qui si contano **tutti** i
        tentativi e non solo quelli falliti: e' proprio la creazione di
        account a macchina che si vuole impedire.
        Risposta: busta ApiBaseResponse con **AccountSummary** in 'data'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account creato ('data' = AccountSummary, nessun token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 201
                message: Registrazione completata con successo
                timestamp: 2026-08-05T10:15:30Z
                data:
                  id: 1
                  nome: Mario
                  cognome: Rossi
                  email: mario.rossi@example.com
                  ruolo: USER
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Login cliente o staff
      description: >
        Autentica un account (cliente o personale) via email/password e
        restituisce **solo** il token JWT: i dati dell'account si
        recuperano a parte, da /api/auth/me. Nessuna autorizzazione
        richiesta.
        I tentativi falliti sono soggetti a un **ritardo progressivo**
        (vedi la risposta 429): superati i primi, fra un tentativo e il
        successivo va rispettata un'attesa che raddoppia ogni volta. Un
        client che riprova in automatico deve leggere il 429 e aspettare,
        non insistere.
        Risposta: busta ApiBaseResponse con **AuthResponse** in 'data'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login riuscito, token JWT emesso ('data' = AuthResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Login effettuato con successo
                timestamp: 2026-08-05T10:15:30Z
                data:
                  token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJtYXJpby5yb3NzaUBleGFtcGxlLmNvbSJ9
                  tokenType: Bearer
                  expiresInMs: 3600000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/me:
    get:
      tags:
        - Auth
      operationId: me
      summary: Dati dell'account autenticato
      description: >
        Restituisce il riepilogo dell'account a cui appartiene il token
        usato per la chiamata. Non prende nessun parametro: l'utente e'
        quello del token, non uno scelto da chi chiama.
        Richiede autenticazione (qualsiasi ruolo).
        Risposta: busta ApiBaseResponse con **AccountSummary** in 'data'.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dati dell'account autenticato ('data' = AccountSummary)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Dati account recuperati
                timestamp: 2026-08-05T10:15:30Z
                data:
                  id: 1
                  nome: Mario
                  cognome: Rossi
                  email: mario.rossi@example.com
                  ruolo: USER
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tipologie-camera:

    get:
      tags:
        - TipologieCamera
      operationId: elencaTipologieCamera
      summary: Elenco paginato delle tipologie di camera
      description: >
        Restituisce le tipologie di camera offerte dalla struttura, in ordine
        alfabetico di nome e divise in pagine. **Pubblico**: e' il catalogo
        che il frontoffice mostra a chi visita il sito senza essersi
        registrato, quindi non richiede autenticazione.
        Risposta: busta ApiBaseResponsePaginated con un **array di
        TipologiaCameraResponse** in 'data' e i metadati di pagina in 'page'.
      parameters:
        - $ref: '#/components/parameters/PaginaNumero'
        - $ref: '#/components/parameters/PaginaDimensione'
      responses:
        '200':
          description: Pagina di tipologie ('data' = array di TipologiaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponsePaginated'
              example:
                status: 200
                message: Tipologie di camera recuperate
                timestamp: 2026-08-06T10:15:30Z
                data:
                  - id: 1
                    nome: Doppia Superior
                    descrizione: Camera doppia con vista sul giardino
                    capienzaMax: 2
                    prezzoNotte: 120.00
                    dotazioni:
                      - id: 1
                        nome: Wi-Fi
                        descrizione: Connessione senza fili gratuita in tutta la struttura
                page:
                  pageNumber: 0
                  pageSize: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - TipologieCamera
      operationId: creaTipologiaCamera
      summary: Crea una tipologia di camera
      description: >
        Aggiunge una tipologia al catalogo. Riservato agli **ADMIN**: e' il
        listino della struttura, non qualcosa che un cliente possa toccare.
        Il nome deve essere libero — il confronto ignora le maiuscole, quindi
        "Doppia" e "doppia" sono lo stesso nome e la seconda riceve 409.
        Risposta: busta ApiBaseResponse con **TipologiaCameraResponse** in 'data'.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipologiaCameraRequest'
      responses:
        '201':
          description: Tipologia creata ('data' = TipologiaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 201
                message: Tipologia di camera creata
                timestamp: 2026-08-06T10:15:30Z
                data:
                  id: 1
                  nome: Doppia Superior
                  descrizione: Camera doppia con vista sul giardino
                  capienzaMax: 2
                  prezzoNotte: 120.00
                  dotazioni:
                    - id: 1
                      nome: Wi-Fi
                      descrizione: Connessione senza fili gratuita in tutta la struttura
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tipologie-camera/{id}:

    get:
      tags:
        - TipologieCamera
      operationId: dettaglioTipologiaCamera
      summary: Dettaglio di una tipologia di camera
      description: >
        Restituisce una singola tipologia. **Pubblico** per lo stesso motivo
        dell'elenco: e' la scheda che il cliente apre dal catalogo.
        Risposta: busta ApiBaseResponse con **TipologiaCameraResponse** in 'data'.
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      responses:
        '200':
          description: Tipologia trovata ('data' = TipologiaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Tipologia di camera recuperata
                timestamp: 2026-08-06T10:15:30Z
                data:
                  id: 1
                  nome: Doppia Superior
                  descrizione: Camera doppia con vista sul giardino
                  capienzaMax: 2
                  prezzoNotte: 120.00
                  dotazioni:
                    - id: 1
                      nome: Wi-Fi
                      descrizione: Connessione senza fili gratuita in tutta la struttura
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - TipologieCamera
      operationId: aggiornaTipologiaCamera
      summary: Aggiorna una tipologia di camera
      description: >
        Sostituisce **tutti** i campi modificabili della tipologia: e' una PUT,
        non una PATCH, quindi un campo omesso viene azzerato e non lasciato
        com'era. Riservato agli **ADMIN**.
        **Le dotazioni non fanno parte di questo schema e non vengono
        toccate**: hanno un endpoint proprio
        (PUT /api/tipologie-camera/{id}/dotazioni). Non e' un'eccezione alla
        semantica della PUT — sono una risorsa a se', non un campo di questa.
        Risposta: busta ApiBaseResponse con **TipologiaCameraResponse** in 'data'.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipologiaCameraRequest'
      responses:
        '200':
          description: Tipologia aggiornata ('data' = TipologiaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Tipologia di camera aggiornata
                timestamp: 2026-08-06T10:15:30Z
                data:
                  id: 1
                  nome: Doppia Superior
                  descrizione: Camera doppia con vista sul mare
                  capienzaMax: 2
                  prezzoNotte: 145.00
                  dotazioni:
                    - id: 1
                      nome: Wi-Fi
                      descrizione: Connessione senza fili gratuita in tutta la struttura
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - TipologieCamera
      operationId: eliminaTipologiaCamera
      summary: Elimina una tipologia di camera
      description: >
        Rimuove la tipologia dal catalogo. Riservato agli **ADMIN**.
        Fallisce con **409** se ci sono camere o prenotazioni che la
        referenziano: il vincolo lo impone il database e cancellare quei dati
        a cascata perderebbe lo storico delle prenotazioni. Per togliere dal
        listino una tipologia gia' usata va prima svuotata dei suoi
        riferimenti.
        Risposta: busta ApiBaseResponse con 'data' null — non c'e' piu' niente
        da restituire. Si usa 200 e non 204 perche' la busta standard vale per
        ogni endpoint del progetto e un 204 non puo' avere corpo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      responses:
        '200':
          description: Tipologia eliminata ('data' = null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Tipologia di camera eliminata
                timestamp: 2026-08-06T10:15:30Z
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tipologie-camera/{id}/dotazioni:

    put:
      tags:
        - TipologieCamera
      operationId: impostaDotazioniTipologiaCamera
      summary: Imposta le dotazioni di una tipologia di camera
      description: >
        Sostituisce **l'intero insieme** delle dotazioni assegnate alla
        tipologia con quello ricevuto: quelle elencate restano o vengono
        aggiunte, quelle assenti vengono staccate. Un array vuoto le toglie
        tutte. Riservato agli **ADMIN**.
        E' una PUT e non due rotte di aggiunta/rimozione perche' l'operazione
        vera del backoffice e' "questa camera offre esattamente questo": una
        sola chiamata, idempotente, che non lascia stati intermedi se il
        client la ripete.
        Se uno degli id non corrisponde a nessuna dotazione la risposta e'
        **400** e non 404: il 404 di questo endpoint significa "questa
        tipologia non esiste", e usarlo anche per gli id nel corpo
        renderebbe le due cose indistinguibili proprio quando servono due
        rimedi diversi.
        Risposta: busta ApiBaseResponse con **TipologiaCameraResponse** in
        'data', gia' aggiornata con le dotazioni appena impostate.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdTipologiaCamera'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipologiaCameraDotazioniRequest'
      responses:
        '200':
          description: Dotazioni impostate ('data' = TipologiaCameraResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Dotazioni della tipologia aggiornate
                timestamp: 2026-08-25T10:15:30Z
                data:
                  id: 1
                  nome: Doppia Superior
                  descrizione: Camera doppia con vista sul giardino
                  capienzaMax: 2
                  prezzoNotte: 120.00
                  dotazioni:
                    - id: 2
                      nome: Aria condizionata
                      descrizione: Climatizzatore con regolazione indipendente
                    - id: 1
                      nome: Wi-Fi
                      descrizione: Connessione senza fili gratuita in tutta la struttura
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/dotazioni:

    get:
      tags:
        - Dotazioni
      operationId: elencaDotazioni
      summary: Elenco paginato delle dotazioni
      description: >
        Restituisce le dotazioni che una tipologia di camera puo' offrire
        (Wi-Fi, aria condizionata, minibar...), in ordine alfabetico di nome
        e divise in pagine. **Pubblico** per lo stesso motivo del catalogo:
        sono le voci che il sito mostra nella scheda di ogni camera, quindi
        le legge anche chi non si e' registrato.
        Risposta: busta ApiBaseResponsePaginated con un **array di
        DotazioneResponse** in 'data' e i metadati di pagina in 'page'.
      parameters:
        - $ref: '#/components/parameters/PaginaNumero'
        - $ref: '#/components/parameters/PaginaDimensione'
      responses:
        '200':
          description: Pagina di dotazioni ('data' = array di DotazioneResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponsePaginated'
              example:
                status: 200
                message: Dotazioni recuperate
                timestamp: 2026-08-25T10:15:30Z
                data:
                  - id: 1
                    nome: Wi-Fi
                    descrizione: Connessione senza fili gratuita in tutta la struttura
                page:
                  pageNumber: 0
                  pageSize: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Dotazioni
      operationId: creaDotazione
      summary: Crea una dotazione
      description: >
        Aggiunge una dotazione all'elenco di quelle assegnabili alle tipologie
        di camera. Riservato agli **ADMIN**. Il nome deve essere libero — il
        confronto ignora le maiuscole, quindi "Wi-Fi" e "wi-fi" sono lo stesso
        nome e il secondo riceve 409.
        Risposta: busta ApiBaseResponse con **DotazioneResponse** in 'data'.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DotazioneRequest'
      responses:
        '201':
          description: Dotazione creata ('data' = DotazioneResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 201
                message: Dotazione creata
                timestamp: 2026-08-25T10:15:30Z
                data:
                  id: 1
                  nome: Wi-Fi
                  descrizione: Connessione senza fili gratuita in tutta la struttura
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/dotazioni/{id}:

    get:
      tags:
        - Dotazioni
      operationId: dettaglioDotazione
      summary: Dettaglio di una dotazione
      description: >
        Restituisce una singola dotazione. **Pubblico** per lo stesso motivo
        dell'elenco.
        Risposta: busta ApiBaseResponse con **DotazioneResponse** in 'data'.
      parameters:
        - $ref: '#/components/parameters/IdDotazione'
      responses:
        '200':
          description: Dotazione trovata ('data' = DotazioneResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Dotazione recuperata
                timestamp: 2026-08-25T10:15:30Z
                data:
                  id: 1
                  nome: Wi-Fi
                  descrizione: Connessione senza fili gratuita in tutta la struttura
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Dotazioni
      operationId: aggiornaDotazione
      summary: Aggiorna una dotazione
      description: >
        Sostituisce **tutti** i campi modificabili della dotazione: e' una PUT,
        non una PATCH, quindi un campo omesso viene azzerato e non lasciato
        com'era. Riservato agli **ADMIN**. Non tocca le tipologie a cui la
        dotazione e' gia' assegnata: quelle continuano ad averla, col nome
        nuovo.
        Risposta: busta ApiBaseResponse con **DotazioneResponse** in 'data'.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdDotazione'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DotazioneRequest'
      responses:
        '200':
          description: Dotazione aggiornata ('data' = DotazioneResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Dotazione aggiornata
                timestamp: 2026-08-25T10:15:30Z
                data:
                  id: 1
                  nome: Wi-Fi
                  descrizione: Connessione senza fili in fibra, gratuita
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Dotazioni
      operationId: eliminaDotazione
      summary: Elimina una dotazione
      description: >
        Rimuove la dotazione dall'elenco. Riservato agli **ADMIN**.
        A differenza della tipologia di camera, **riesce anche se la dotazione
        e' assegnata a qualche tipologia**: i legami spariscono con lei. Non e'
        una svista ma la differenza fra i due casi — una tipologia usata porta
        con se' lo storico delle prenotazioni, mentre una dotazione tolta dal
        listino e' semplicemente una voce che non si offre piu', e lasciarla
        appesa alle schede sarebbe l'unico esito sbagliato.
        Risposta: busta ApiBaseResponse con 'data' null. Si usa 200 e non 204
        perche' la busta standard vale per ogni endpoint del progetto e un 204
        non puo' avere corpo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdDotazione'
      responses:
        '200':
          description: Dotazione eliminata ('data' = null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Dotazione eliminata
                timestamp: 2026-08-25T10:15:30Z
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  # Parametri riusabili, stessa logica dei responses qui sotto: si dichiarano
  # una volta e si referenziano, invece di ripetere descrizione e vincoli su
  # ogni rotta che li usa.
  parameters:

    IdTipologiaCamera:
      name: id
      in: path
      required: true
      description: Identificativo della tipologia di camera
      schema:
        type: integer
        format: int64
        minimum: 1

    IdDotazione:
      name: id
      in: path
      required: true
      description: Identificativo della dotazione
      schema:
        type: integer
        format: int64
        minimum: 1

    PaginaNumero:
      name: page
      in: query
      required: false
      description: Numero della pagina richiesta, 0-based
      schema:
        type: integer
        minimum: 0
        default: 0

    PaginaDimensione:
      name: size
      in: query
      required: false
      description: >
        Quanti elementi contiene una pagina. Il massimo non e' arbitrario
        ne' negoziabile: senza un tetto, una sola richiesta con un size
        enorme si farebbe restituire l'intera tabella in un colpo.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # Risposte d'errore riusabili: tutte usano la stessa busta ApiBaseResponse
  # degli endpoint di successo (con 'data' null, tranne la validazione — vedi
  # BadRequest). Si dichiarano qui una volta sola e si referenziano con $ref
  # dai singoli endpoint, invece di riscriverle ad ogni rotta.
  responses:

    BadRequest:
      description: >
        Richiesta non valida: violazione dei vincoli dichiarati sullo schema
        del body (@Valid), JSON malformato, tipo di parametro sbagliato, o
        una regola applicativa sull'input (es. consenso privacy non
        accettato). E' l'unico errore con 'data' valorizzato: quando
        l'errore viene dalla validazione dei campi, 'data' contiene una
        mappa nome-campo -> messaggio, cosi' il client puo' segnalare il
        singolo input sbagliato senza interpretare il messaggio testuale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 400
            message: Dati non validi
            timestamp: 2026-08-05T10:15:30Z
            data:
              password: deve contenere almeno 8 caratteri
              email: deve essere un indirizzo email valido

    Unauthorized:
      description: >
        Autenticazione assente o non valida: token mancante, malformato,
        scaduto, account disattivato, oppure credenziali errate sul login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 401
            message: Autenticazione richiesta
            timestamp: 2026-08-05T10:15:30Z
            data: null

    Forbidden:
      description: >
        Account autenticato ma senza i permessi necessari (ruolo
        insufficiente). Diverso dal 401: qui l'identita' e' nota, non basta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 403
            message: Permessi insufficienti per questa operazione
            timestamp: 2026-08-05T10:15:30Z
            data: null

    NotFound:
      description: >
        La risorsa indicata non esiste. Vale anche per una risorsa cancellata
        nel frattempo: dal punto di vista di chi chiama i due casi sono lo
        stesso, e distinguerli direbbe a chi prova identificativi a caso quali
        sono stati usati davvero.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 404
            message: Tipologia di camera non trovata
            timestamp: 2026-08-06T10:15:30Z
            data: null

    Conflict:
      description: >
        La richiesta e' formalmente valida ma confligge con lo stato
        attuale della risorsa (es. email gia' registrata).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 409
            message: Email gia' registrata
            timestamp: 2026-08-05T10:15:30Z
            data: null

    TooManyRequests:
      description: >
        Troppi tentativi ravvicinati su un endpoint pubblico e costoso: la
        richiesta viene rifiutata **prima** di essere elaborata, quindi non
        ha nessun effetto. Non e' mai un blocco definitivo, ma un'attesa
        obbligatoria fra un tentativo e il successivo, che raddoppia ad ogni
        tentativo di troppo fino a un tetto e si azzera da sola dopo un
        periodo di inattivita'. Il messaggio indica fra quanto riprovare, ed
        e' l'unico posto in cui l'attesa residua viene comunicata: la busta
        non ha un campo dedicato. Un client che riprova in automatico deve
        leggerlo e aspettare, non insistere.
        Cosa faccia scattare il limite dipende dall'endpoint — sul login i
        tentativi falliti per email e per indirizzo IP, sulla registrazione
        tutte le registrazioni dello stesso indirizzo — ed e' descritto sul
        singolo endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 429
            message: Troppi tentativi di accesso falliti. Riprova fra 8 secondi
            timestamp: 2026-08-05T10:15:30Z
            data: null

    InternalServerError:
      description: >
        Errore inatteso lato server. Il messaggio e' volutamente generico:
        il dettaglio dell'eccezione resta nei log e non viene esposto al
        client.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBaseResponse'
          example:
            status: 500
            message: Si e' verificato un errore imprevisto
            timestamp: 2026-08-05T10:15:30Z
            data: null

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT ottenuto da /api/auth/login, da inviare nell'header
        Authorization come "Bearer <token>".

  schemas:

    RegisterRequest:
      type: object
      description: Dati per la registrazione di un nuovo cliente (frontoffice)
      required:
        - nome
        - cognome
        - email
        - password
        - consensoPrivacy
      properties:
        nome:
          type: string
          minLength: 1
          example: Mario
        cognome:
          type: string
          minLength: 1
          example: Rossi
        email:
          type: string
          format: email
          description: Usata anche come credenziale di login
          example: mario.rossi@example.com
        password:
          type: string
          minLength: 8
          description: Password in chiaro (verra' salvata come hash BCrypt, mai in chiaro)
          example: PasswordSicura123
        telefono:
          type: string
          example: "+39 333 1234567"
        dataNascita:
          type: string
          format: date
          example: "1990-05-20"
        consensoPrivacy:
          type: boolean
          description: >
            Consenso al trattamento dei dati personali (GDPR): deve essere
            true per completare la registrazione. Non e' esprimibile come
            constraint OpenAPI (non esiste un "deve valere true"), quindi
            il vincolo e' verificato nel service, che risponde 400 se il
            consenso non e' stato dato.

    LoginRequest:
      type: object
      description: Credenziali di login, valide sia per clienti (Utente) sia per personale (Staff)
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          example: PasswordSicura123

    AccountSummary:
      type: object
      description: >
        Riepilogo essenziale di un account autenticato (cliente o
        personale): formato unico perche' il login puo' autenticare
        indifferentemente un Utente o uno Staff.
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        ruolo:
          type: string
          description: "Nome del ruolo: ADMIN, STAFF o USER"
          example: USER

    AuthResponse:
      type: object
      description: >
        Token JWT emesso. Solo il token: i dati dell'account non stanno
        qui, si recuperano dall'endpoint dedicato /api/auth/me usando il
        token appena ottenuto.
      properties:
        token:
          type: string
          description: "Token JWT da usare come header: Authorization: Bearer <token>"
        tokenType:
          type: string
          example: Bearer
        expiresInMs:
          type: integer
          format: int64
          description: Scadenza del token in millisecondi da adesso
          example: 3600000

    TipologiaCameraRequest:
      type: object
      description: >
        Dati di una tipologia di camera in scrittura (creazione e
        aggiornamento usano lo stesso schema: una PUT sostituisce l'intera
        risorsa, quindi i campi richiesti sono gli stessi della POST).
        I limiti dichiarati qui non sono decorativi: rispecchiano le colonne
        del database (vedi V1__init_schema.sql). Senza, un nome piu' lungo
        della colonna o un prezzo fuori scala arriverebbero fino a Postgres e
        tornerebbero al client come 500 invece che come 400.
      required:
        - nome
        - capienzaMax
        - prezzoNotte
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Nome commerciale della tipologia. Deve essere unico a meno delle
            maiuscole (vincolo garantito da un indice unico su lower(nome)).
          example: Doppia Superior
        descrizione:
          type: string
          maxLength: 2000
          description: >
            Testo libero mostrato nella scheda del catalogo. La colonna e' un
            TEXT senza limite, ma il limite qui c'e' lo stesso: un campo di
            testo pubblico e senza tetto e' un modo per far scrivere megabyte
            a chiunque abbia il permesso di scrivere.
          example: Camera doppia con vista sul giardino, letto matrimoniale e balcone
        capienzaMax:
          type: integer
          minimum: 1
          description: Numero massimo di persone che possono alloggiare nella camera
          example: 2
        prezzoNotte:
          type: number
          minimum: 0
          maximum: 99999999.99
          description: >
            Prezzo per notte in euro, con **al massimo due decimali**: oltre,
            la risposta e' 400. Il vincolo non e' esprimibile in modo utile
            nello schema (OpenAPI ha multipleOf, ma il generatore Java non lo
            traduce in nessuna annotazione), quindi lo verifica il service —
            come per il consenso privacy in registrazione. Rifiutare e'
            deliberato: la colonna e' NUMERIC(10,2) e accettare il valore
            vorrebbe dire arrotondarlo senza dirlo a chi l'ha scritto.
            Provvisorio per disegno: e' un prezzo fisso, segnaposto finche' non
            esistera' un vero sistema di tariffe stagionali (vedi
            ANALISI_FUNZIONALE). Il massimo corrisponde a quanto entra nella
            colonna.
          example: 120.00

    TipologiaCameraResponse:
      type: object
      description: >
        Tipologia di camera come viene restituita al client, dotazioni
        comprese. Le foto no: quelle arrivano con l'entita' dedicata, che non
        fa parte di questo giro.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Doppia Superior
        descrizione:
          type: string
          example: Camera doppia con vista sul giardino
        capienzaMax:
          type: integer
          example: 2
        prezzoNotte:
          type: number
          example: 120.00
        dotazioni:
          type: array
          description: >
            Dotazioni assegnate alla tipologia, in ordine alfabetico di nome.
            Array vuoto se non ne ha nessuna. Non si impostano dallo schema di
            scrittura della tipologia ma da
            PUT /api/tipologie-camera/{id}/dotazioni.
          items:
            $ref: '#/components/schemas/DotazioneResponse'

    TipologiaCameraDotazioniRequest:
      type: object
      description: >
        Insieme completo delle dotazioni da assegnare a una tipologia di
        camera. E' una sostituzione, non un'aggiunta: cio' che non compare
        nella lista viene staccato.
      required:
        - dotazioniIds
      properties:
        dotazioniIds:
          type: array
          uniqueItems: true
          maxItems: 100
          description: >
            Id delle dotazioni da assegnare. **Array vuoto = nessuna
            dotazione**, ed e' il modo per toglierle tutte: e' un valore
            legittimo, non un errore. Ripetere lo stesso id non e' un errore
            nemmeno quello — un insieme e' un insieme, e la seconda copia
            viene semplicemente ignorata. Il tetto di 100 elementi c'e' per lo
            stesso motivo del tetto sulle pagine: una lista senza limite e' un
            modo per far fare al server un lavoro deciso da chi chiama.
          items:
            type: integer
            format: int64
            minimum: 1
          example: [1, 2]

    DotazioneRequest:
      type: object
      description: >
        Dati di una dotazione in scrittura (creazione e aggiornamento usano lo
        stesso schema: una PUT sostituisce l'intera risorsa, quindi i campi
        richiesti sono gli stessi della POST).
        I limiti dichiarati qui rispecchiano le colonne del database (vedi
        V1__init_schema.sql): senza, un valore fuori misura arriverebbe fino a
        Postgres e tornerebbe al client come 500 invece che come 400.
      required:
        - nome
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Nome della dotazione, mostrato nella scheda della camera. Deve
            essere unico a meno delle maiuscole (vincolo garantito da un
            indice unico su lower(nome), vedi
            V3__unicita_nome_dotazione.sql).
          example: Wi-Fi
        descrizione:
          type: string
          maxLength: 255
          description: >
            Dettaglio facoltativo di cosa comprende la dotazione. Il limite
            ricalca la colonna VARCHAR(255).
          example: Connessione senza fili gratuita in tutta la struttura

    DotazioneResponse:
      type: object
      description: Dotazione come viene restituita al client
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Wi-Fi
        descrizione:
          type: string
          example: Connessione senza fili gratuita in tutta la struttura

    ApiBaseResponse:
      type: object
      description: >
        Busta di risposta standard di TUTTI gli endpoint non paginati:
        status, messaggio, timestamp e il payload in 'data'. E' l'unica
        busta non paginata del progetto — non si dichiara un envelope per
        endpoint. Quale oggetto arrivi dentro 'data' e' indicato nella
        description del singolo endpoint (OpenAPI non ha i generics: non
        c'e' modo di scrivere qui "data: T" e tenere insieme un solo
        schema).
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: integer
          description: Codice di stato HTTP
          example: 200
        message:
          type: string
          description: Messaggio leggibile, di successo o di errore
          example: Operazione completata con successo
        timestamp:
          type: string
          format: date-time
          description: Istante in cui e' stata generata la risposta
        data:
          type: object
          description: >
            Payload della risposta: l'oggetto (o l'array) richiesto, null
            in caso di errore. Il tipo concreto e' documentato nella
            description dell'endpoint che restituisce questa busta.
            Unica eccezione al "null in caso di errore": sugli errori di
            validazione (400) 'data' porta la mappa nome-campo ->
            messaggio dei campi rifiutati.

    ApiBaseResponsePaginated:
      description: >
        Come ApiBaseResponse, ma per gli endpoint il cui 'data' e' una
        pagina di risultati: aggiunge 'page' con i metadati di
        paginazione. Schema separato (invece di 'page' sempre presente ma
        nullable) cosi' le risposte non paginate non portano un campo
        inutile.
      allOf:
        - $ref: '#/components/schemas/ApiBaseResponse'
        - type: object
          properties:
            page:
              $ref: '#/components/schemas/PageInfo'

    PageInfo:
      type: object
      description: Metadati di paginazione
      properties:
        pageNumber:
          type: integer
          description: Numero di pagina corrente (0-based)
          example: 0
        pageSize:
          type: integer
          description: Dimensione della pagina
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Numero totale di elementi su tutte le pagine
          example: 134
        totalPages:
          type: integer
          description: Numero totale di pagine
          example: 7
