  /api/prenotazioni/{id}/check-in:

    put:
      tags:
        - Prenotazioni
      operationId: checkInPrenotazione
      summary: Registra l'arrivo dell'ospite e gli assegna una camera (CONFERMATA -> CHECK_IN)
      description: >
        L'ospite e' arrivato al banco. Da **CONFERMATA** a **CHECK_IN**, ed e'
        qui che la prenotazione smette di riguardare una *tipologia* e comincia
        a riguardare una *stanza*: fino a questo momento il cliente aveva
        comprato "una doppia superior dal 10 al 13", da adesso ha la 101.
        **La camera la sceglie il backend**, fra quelle della tipologia
        prenotata che sono LIBERA e che nessun'altra prenotazione gia' arrivata
        occupa in quei giorni; a parita' di condizioni vince la prima in ordine
        di numero, cosi' la scelta e' ripetibile e non dipende dall'ordine in cui
        il database restituisce le righe. L'ordine e' alfabetico e non numerico,
        perche' un numero di camera e' una targhetta e non una quantita': la 10
        viene prima della 9. Il corpo e' **facoltativo** e serve a una
        cosa sola: se chi sta al banco vuole una stanza precisa la nomina in
        'cameraId', e quella prevale.
        **Quando si puo' fare**: dal giorno di arrivo fino alla notte prima
        della partenza. Prima e' **409** — non si mette OCCUPATA una camera per
        un soggiorno non ancora cominciato — e dal giorno di partenza in poi
        pure, perche' non si entra in un soggiorno gia' finito.
        **409 finche' non e' registrato il documento di ogni ospite.** Il TULPS
        obbliga ad acquisire il documento di *ogni persona che soggiorna*
        all'atto dell'arrivo, non del solo intestatario: il conto degli ospiti
        registrati (POST /api/prenotazioni/{id}/ospiti) deve essere **esattamente
        `numeroOspiti`**. E' un'uguaglianza e non un "almeno uno" perche' e'
        l'intero elenco che la legge vuole, e perche' quel conteggio e' gia'
        limitato dall'alto: registrare un ospite oltre `numeroOspiti` e' a sua
        volta un 409. La sequenza al banco e' quindi: documenti, POST per
        ognuno, e solo allora questo check-in.
        **Effetto sulla camera**: passa a **OCCUPATA**. E' l'unico posto in cui
        l'applicazione cambia da sola lo stato operativo di una stanza; per
        tutto il resto c'e' PUT /api/camere/{id}/stato.
        **409 se non c'e' nessuna camera assegnabile**, e puo' succedere anche a
        prenotazione regolarmente confermata: la disponibilita' conta tutte le
        camere della tipologia, comprese quelle che oggi sono in manutenzione,
        perche' uno stato di oggi non dice niente su un soggiorno di novembre.
        Chi sta al banco lo risolve come si risolve in un albergo: libera una
        stanza, oppure ne assegna a mano un'altra.
        Solo **STAFF** e **ADMIN**: e' un'operazione di turno, non qualcosa che
        un cliente faccia da solo.
        Risposta: busta ApiBaseResponse con **PrenotazioneResponse** in 'data',
        stavolta con 'camera' valorizzata.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPrenotazione'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrenotazioneCheckInRequest'
      responses:
        '200':
          description: Arrivo registrato ('data' = PrenotazioneResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBaseResponse'
              example:
                status: 200
                message: Check-in registrato
                timestamp: 2026-09-10T15:04:00Z
                data:
                  id: 1
                  dataCheckIn: 2026-09-10
                  dataCheckOut: 2026-09-13
                  numeroOspiti: 2
                  stato: CHECK_IN
                  canale: ONLINE
                  importoTotale: 360.00
                  note: null
                  utente:
                    id: 7
                    nome: Mario
                    cognome: Rossi
                    email: mario.rossi@example.com
                  tipologia:
                    id: 1
                    nome: Doppia Superior
                  camera:
                    id: 4
                    numero: "101"
                    piano: 1
                    tipologia:
                      id: 1
                      nome: Doppia Superior
                  gestitaDa: null
                  motivoCancellazione: null
                  dataCancellazione: null
        '400':
