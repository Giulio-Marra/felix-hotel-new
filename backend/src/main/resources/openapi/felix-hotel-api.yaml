      summary: Dettaglio di una prenotazione
      description: >
        Restituisce una singola prenotazione. **STAFF** e **ADMIN** vedono
        qualsiasi prenotazione; un **USER** vede solo le proprie.
        La prenotazione di qualcun altro risponde **404 e non 403**, ed e'
