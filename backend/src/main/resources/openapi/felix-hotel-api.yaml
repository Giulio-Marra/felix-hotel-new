      operationId: annullaPrenotazione
      summary: Annulla una prenotazione
      description: >
        Porta la prenotazione in **ANNULLATA**, registrando quando e — se
        indicato — perche'. Da quel momento non conta piu' per la
        disponibilita': la camera torna prenotabile da chiunque.
        Si annulla una prenotazione **IN_ATTESA** o **CONFERMATA**. Annullare
        cio' che e' gia' annullato e' **409**.
        **Non esiste un endpoint che cancelli una prenotazione**, e non e' una
        dimenticanza: una prenotazione e' un fatto accaduto, e l'annullamento e'
        il modo in cui smette di valere senza sparire dallo storico. Per lo
        stesso motivo non esiste una PUT che ne cambi le date — si annulla e se
        ne apre un'altra, cosi' la disponibilita' viene ricalcolata invece che
        aggirata.
        Puo' annullare il titolare della prenotazione, oppure **STAFF** e
        **ADMIN** per chiunque.
        Il corpo e' facoltativo: senza, l'annullamento e' registrato lo stesso e
        il motivo resta null.
        Risposta: busta ApiBaseResponse con **PrenotazioneResponse** in 'data'.
