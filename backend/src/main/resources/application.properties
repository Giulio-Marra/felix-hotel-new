spring.application.name=backend

# Database - valori reali in un file .env locale (mai committato), vedi .env.example
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:felix_hotel}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Lo schema e' gestito da Flyway (vedi src/main/resources/db/migration): Hibernate si limita a validare
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Protezione dal brute force sul login (vedi LoginRateLimitProperties).
# Non e' un blocco dell'account: dopo i tentativi "liberi" si impone un'attesa fra un
# tentativo e il successivo, che raddoppia ogni volta fino al tetto. Con questi valori chi
# sbaglia la propria password 3-4 volte non se ne accorge, mentre un attacco automatico
# scende da migliaia di tentativi al secondo a circa venti in un quarto d'ora.
# Non sono segreti, quindi stanno qui e non fra le variabili d'ambiente (regola 9).
felix.security.login.tentativi-liberi-email=4
felix.security.login.tentativi-liberi-ip=20
felix.security.login.ritardo-iniziale=1s
felix.security.login.ritardo-massimo=60s
felix.security.login.finestra=15m

# Limite di frequenza sulla registrazione (vedi RegistrationRateLimitProperties). Stesso
# meccanismo del login, ma qui si contano TUTTI i tentativi e non solo quelli falliti:
# l'abuso da fermare e' la creazione di account a macchina, e ogni chiamata ci costa un
# hash BCrypt piu' una scrittura. Le soglie sono molto piu' strette perche' la frequenza
# legittima e' incomparabile — una persona si registra una volta sola, e i cinque tentativi
# liberi ci sono per chi sbaglia un campo o condivide l'indirizzo con altri (NAT).
felix.security.registration.tentativi-liberi-ip=5
felix.security.registration.ritardo-iniziale=5s
felix.security.registration.ritardo-massimo=5m
felix.security.registration.finestra=1h

# CORS: la chiave e' felix.security.cors.allowed-origins e qui NON e' dichiarata,
# di proposito. Il default chiuso e' scritto in un posto solo — @DefaultValue({})
# su CorsProperties — perche' un default scritto due volte e' un default che il
# giorno che cambia resta vero solo in uno dei due. Quello in Java vale sempre,
# anche per un ambiente che non carica questo file; una riga vuota qui varrebbe
# solo per il profilo di default.
# Le origini si dichiarano per ambiente: in locale le apre il profilo "dev"
# (application-dev.properties), in produzione andranno messi i domini veri.

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Swagger UI mostra direttamente lo spec YAML (servito da OpenApiSpecConfig) invece della
# documentazione che springdoc ricostruisce dalle annotazioni: il progetto e' contract-first,
# quindi la fonte di verita' deve essere il contratto. In piu' le annotazioni generate perdono
# per strada esempi e dettagli scritti nello YAML, che cosi' invece si vedono.
# La versione dedotta dal codice resta comunque consultabile su /v3/api-docs come controprova.
springdoc.swagger-ui.url=/openapi/felix-hotel-api.yaml

# Livelli di log
# Spring Security avvisa ad ogni avvio che l'AuthenticationManager globale e' configurato
# con un AuthenticationProvider bean, e che quindi i UserDetailsService non verranno usati
# per cablare da soli il login utente/password. E' esattamente quello che vogliamo: il
# DaoAuthenticationProvider di SecurityConfig e' costruito a mano proprio per dargli il
# nostro CustomUserDetailsService, che e' una delle due alternative suggerite dal messaggio
# stesso. Quindi qui si toglie il sintomo e non la causa — la causa e' una scelta.
# Il livello da alzare lo dice il messaggio in fondo a se stesso, e alzarlo a ERROR e' il
# modo documentato di zittirlo: non un filtro nostro su una classe di libreria.
# Perche' vale la pena: un avvio che stampa sempre un avviso e' un avvio in cui il prossimo
# avviso — quello vero — non si nota.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Email. Il trasporto e' SMTP anche in produzione (scelta del 2026-08-28): Resend lo
# espone accanto alla sua API HTTP, e SMTP e' l'unico dei due che Mailpit sappia
# intercettare in sviluppo — cosi' fra i due ambienti cambia questa configurazione e non
# il codice. La password NON sta qui: e' un segreto, quindi variabile d'ambiente
# (regola 9), e in sviluppo non serve affatto perche' Mailpit non autentica nessuno.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Su Mailpit vanno tutte e due a false: non fa STARTTLS e non chiede credenziali.
# In produzione si valorizzano a true dall'ambiente, insieme a host e password.
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# Senza questo, un SMTP irraggiungibile tiene appeso il thread finche' il sistema
# operativo non si arrende: l'invio non fa fallire niente (vedi ServizioEmail), ma
# senza timeout occuperebbe comunque un thread per minuti.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Chi firma le email e dove riportano i loro link (vedi EmailProperties). Non sono
# segreti, quindi stanno qui. Il base-url e' l'indirizzo del **frontend** il giorno in
# cui ci sara': chi riceve un invito deve atterrare su una pagina, non su un JSON.
felix.email.mittente=${MAIL_MITTENTE:felix-hotel@example.com}
felix.email.base-url=${APP_BASE_URL:http://localhost:8080}
