# Profilo "test": attivo solo nei test di integrazione (vedi IntegrationTestBase).
#
# Non ridefinisce la configurazione dell'applicazione, la completa: application.properties
# resta la fonte di verita' e da qui si valorizzano soltanto i segnaposto che in esecuzione
# normale arrivano dalle variabili d'ambiente (${DB_USERNAME}, ${JWT_SECRET}, ...).
# Senza questi valori il contesto non partirebbe proprio, perche' quei segnaposto non hanno
# un default.

# Credenziali del datasource: presenti solo per far risolvere i segnaposto. I valori veri
# li impone Testcontainers a runtime tramite @ServiceConnection (vedi TestcontainersConfig),
# che ha la precedenza: i test non si collegano mai al Postgres di sviluppo.
DB_USERNAME=test
DB_PASSWORD=test

# Segreto di firma dei JWT usato SOLO nei test: non e' e non deve essere quello reale.
# Deve comunque superare i 32 byte richiesti da HMAC-SHA256 (vedi JwtService), altrimenti
# jjwt rifiuta la chiave e ogni test che tocca l'autenticazione fallisce all'avvio.
JWT_SECRET=chiave-di-test-non-segreta-lunga-abbastanza-per-hmac-sha256
JWT_EXPIRATION_MS=3600000

# Soglie del ritardo antibrute force abbassate, cosi' i test le raggiungono in pochi
# tentativi invece di doverne fare venti. Non e' una configurazione di test che diverge da
# quella vera: il meccanismo e' identico, cambiano solo i numeri — che sono parametri
# proprio perche' la taratura giusta dipende dall'ambiente (vedi LoginRateLimitProperties).
felix.security.login.tentativi-liberi-email=2
felix.security.login.tentativi-liberi-ip=4

# Le migration girano su un database vuoto ad ogni esecuzione: cosi' i test verificano
# anche il DDL, non solo il codice Java.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
